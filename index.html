    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates]
                : f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [];
    polys.forEach(coords => {
      const geom = { type: 'Polygon', coordinates: coords };
      const area = path.area(geom);
      if (!isFinite(area) || area >= QUIZ_HIT_MAX_AREA) return;
      const dStr = path(geom);
      if (dStr) items.push({ feature: f, key, area, d: dStr });
    });
  });
  if (!items.length) return;
  // Biggest first so the smallest islands end up on top where margins overlap.
  items.sort((a, b) => b.area - a.area);
  const hitG = g.insert('g', '#countries-g').attr('id', 'quiz-hit-g');
  hitG.selectAll('path').data(items).join('path')
    .attr('d', it => it.d)
    .attr('fill', 'none')
    .attr('stroke', 'transparent')
    .attr('stroke-width', QUIZ_HIT_STROKE)
    .attr('stroke-linejoin', 'round')
    .attr('vector-effect', 'non-scaling-stroke')
    .on('click', function(event, it) {
      if (!quizMode || quizRegion !== regionKey) return;
      const el = realEls.get(it.key);
      if (el) quizHandleClick(event, it.key, el);
    })
    .on('mouseenter', function(event, it) {
      if (!quizMode || quizRegion !== regionKey) return;
      if (quizHoverOutline) quizHoverOutline.attr('d', path(it.feature)).classed('show', true);
      const el = realEls.get(it.key);
      if (el) d3.select(el).classed('quiz-hovered', true);
    })
    .on('mouseleave', function(event, it) {
      if (quizHoverOutline) quizHoverOutline.classed('show', false);
      const el = realEls.get(it.key);
      if (el) d3.select(el).classed('quiz-hovered', false);
    });
}

async function drawMap(regionKey) {
  const prevRegion = currentRegion;
  currentRegion = regionKey;
  const region = REGIONS[regionKey];
  const isWorld = regionKey === 'world';
  const isUSA = regionKey === 'usa';
  const isJapan = regionKey === 'japan';
  const isSpain = regionKey === 'spain';
  const isPoland = regionKey === 'poland';
  const res = isWorld ? '110m' : '50m';

  // Show the "I LOVE YOU NASTYA" banner whenever the Japan map is (re)loaded —
  // but not on every resize-triggered redraw while already viewing it.
  if (isJapan && prevRegion !== 'japan') showJapanLoveMessage();

  // Quiz mode is tied to the one map it was started on (see QUIZ_CFG); quietly
  // turn it off whenever a different map is drawn (the indicator chip hides itself).
  if (quizMode && quizRegion !== regionKey) setQuizMode(false);
  const usQuizOn = isUSA && quizMode && quizRegion === 'usa'; // US States quiz: draw clickable state shapes instead of counties
  const spainQuizOn = isSpain && quizMode && quizRegion === 'spain'; // Spain quiz: draw clickable province shapes instead of the country outline
  const polandQuizOn = isPoland && quizMode && quizRegion === 'poland'; // Poland quiz: draw clickable voivodeship shapes instead of the country outline



  const geoData = await getGeoData(res);
  // Pre-fetch US states + counties data for the USA mode
  const usStatesData   = isUSA ? await getGeoData('us-states')   : null;
  const usCountiesData = isUSA && !usQuizOn ? await getGeoData('us-counties') : null; // the state quiz doesn't need the (large) county file
  // Pre-fetch prefecture-level Japan data for the Japan mode
  const japanPrefData  = isJapan ? await getGeoData('japan-prefs') : null;
  // Province shapes for the Spain quiz
  const spainRegionData = spainQuizOn ? await getGeoData('es-provinces') : null;
  // Voivodeship shapes for the Poland quiz
  const polandRegionData = polandQuizOn ? await getGeoData('pl-voivodeships') : null;

  const [W, H] = getMapSize();
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  document.getElementById('mapWrap').style.background = S.seaColor;

  // Reset zoom
  currentTransform = d3.zoomIdentity;
  _physicalBakedTransform = d3.zoomIdentity;
  svg.call(zoomBehavior.transform, d3.zoomIdentity);
  document.getElementById('zoomLbl').textContent = '100%';

  projection = region.makeProj(W, H);
  currentProjScale = projection.scale();
  const path = d3.geoPath().projection(projection);

  svg.select('#physical-g').remove();
  svg.append('g').attr('id', 'physical-g'); // untransformed layer for the satellite raster, drawn first (behind)

  svg.select('#map-g').remove();
  const g = svg.append('g').attr('id', 'map-g');

  // Sea background
  if (isWorld) {
    g.append('path').datum({type:'Sphere'}).attr('d', path)
      .attr('id','sphere').attr('fill', S.seaColor).attr('stroke','none');
  } else {
    g.append('rect').attr('id','sphere')
      .attr('x',0).attr('y',0).attr('width',W).attr('height',H)
      .attr('fill', S.seaColor);
  }

  // Land + borders — skip world-atlas land for USA/Japan (use their own high-res shapes instead)
  if (!isUSA && !isJapan && !spainQuizOn && !polandQuizOn) {
    let countryFeatures = topojson.feature(geoData, geoData.objects.countries).features;
    countryFeatures.forEach(fixInvertedWinding);
    // Several disputed territories (Kosovo, Northern Cyprus, Somaliland...)
    // share a single non-ISO placeholder id in this dataset rather than each
    // having their own unique numeric id. That breaks any Set keyed by
    // `.id` — filtering out Kosovo but keeping some other territory that
    // happens to share its id would make Kosovo's `.id` look "retained"
    // again. Tag each feature with its actual source geometry OBJECT
    // (unique by reference, not by value) so later filtering can be checked
    // by identity instead.
    const countryGeoms = geoData.objects.countries.geometries;
    countryFeatures.forEach((f, i) => { f.__geom = countryGeoms[i]; });

    // The world-atlas dataset folds French Guiana into France's MultiPolygon
    // (there is no separate feature for it), so region filtering by country
    // dropped it from the South America map along with the rest of France.
    // Pull its polygon(s) out into their own feature with French Guiana's
    // ISO numeric id (254 -> 'GF'), leaving the rest of France untouched.
    // Visually nothing changes on maps that draw both (e.g. the world map).
    (function splitFrenchGuiana() {
      const GF_ID = 254, FR_ID = 250;
      const fr = countryFeatures.find(f => Number(f.id) === FR_ID);
      if (!fr || !fr.geometry || fr.geometry.type !== 'MultiPolygon') return;
      if (countryFeatures.some(f => Number(f.id) === GF_ID)) return; // already separate in this dataset
      const inGuiana = poly => {
        const c = d3.geoCentroid({ type: 'Polygon', coordinates: poly });
        return c[0] > -60 && c[0] < -49 && c[1] > 0 && c[1] < 7;
      };
      const gfPolys = fr.geometry.coordinates.filter(inGuiana);
      if (!gfPolys.length) return;
      fr.geometry = { ...fr.geometry, coordinates: fr.geometry.coordinates.filter(poly => !inGuiana(poly)) };
      countryFeatures.push({
        type: 'Feature',
        id: GF_ID,
        properties: { ...(fr.properties || {}), name: 'French Guiana' },
        geometry: { type: 'MultiPolygon', coordinates: gfPolys },
        __geom: {},
      });
    })();

    // Regional views load the full 50m worldwide dataset (needed for sharp
    // coastlines in the area you're looking at) but until now rendered EVERY
    // country on Earth at that resolution as its own SVG path — including
    // ones nowhere near the screen. That's tens of thousands of extra path
    // vertices the browser still has to account for and re-rasterize on
    // every zoom tick, which is exactly why zoom felt heavy in regional
    // views but not on the (much lower-res) World view. Drop any country
    // whose projected bounding box doesn't even overlap a generously-padded
    // viewport before creating a path element for it — padded wide enough to
    // stay correct at scaleExtent's 0.5x zoom-out and normal panning.
    if (!isWorld) {
      const margin = Math.max(W, H) * 1.5;
      const lo = -margin, hiX = W + margin, hiY = H + margin;
      countryFeatures = countryFeatures.filter(f => {
        const b = path.bounds(f);
        return b && isFinite(b[0][0]) && isFinite(b[0][1]) && isFinite(b[1][0]) && isFinite(b[1][1]) &&
          b[1][0] >= lo && b[0][0] <= hiX && b[1][1] >= lo && b[0][1] <= hiY;
      });
      // Some regions (currently just Europe) sit right up against a
      // neighbouring continent within their clip box — e.g. North Africa and
      // the Caucasus poke into Europe's viewport. For those, additionally
      // drop any feature whose ISO2 (via the numeric-id lookup, falling back
      // to a geographic check for disputed territories with no numeric id)
      // is known and NOT in this region's country list.
      //
      // A feature that can't be identified at all (no numeric-id match, and
      // not one of the handful of disputed territories identifyDisputedTerritory
      // knows by location — e.g. a small island with no clean ISO code in
      // this dataset) used to default to "keep it", on the theory that it's
      // safer not to drop something we can't recognize. That was exactly
      // backwards, the same way the old Kosovo/N.-Cyprus handling was: it
      // meant any such orphan sliver leaked into every single strict region
      // (a stray island near Estonia showing up on the Asia map, for
      // instance) instead of being scoped to the one region it belongs on.
      // Since disputed territories we actually care about are already
      // explicitly identified above, anything left unidentified is now
      // dropped from strict regions rather than kept by default.
      if (region.strictCountries && region.countries) {
        const allowed = new Set(region.countries);
        countryFeatures = countryFeatures.filter(f => {
          const iso2 = NUM_TO_ISO[Number(f.id)] || identifyDisputedTerritory(f);
          return iso2 ? allowed.has(iso2) : false;
        });
      }
    }
    // Russia straddles Europe and Asia as a single landmass, so it's kept
    // whole by the strictCountries filter above (dropping the whole feature
    // isn't an option — both regions legitimately want part of it). Instead,
    // slice its geometry at the Urals so each region only shows its own
    // side — reusing the same longitude threshold the city-filtering logic
    // already uses (region.russiaMaxLon / russiaMinLon above).
    if (region.russiaMaxLon != null || region.russiaMinLon != null) {
      countryFeatures = countryFeatures.map(f => {
        if (NUM_TO_ISO[Number(f.id)] !== 'RU') return f;
        const threshold = region.russiaMaxLon != null ? region.russiaMaxLon : region.russiaMinLon;
        const keepEast = region.russiaMinLon != null;
        return clipFeatureByLon(f, threshold, keepEast);
      }).filter(f => f && f.geometry && f.geometry.coordinates.length > 0);
    }
    const retainedGeoms = new Set(countryFeatures.map(f => f.__geom));
    // Russia's border mesh comes from the original (unclipped) topology, so
    // without this, its shared border with a neighbor that isn't part of
    // this region (e.g. Russia–Finland while viewing Asia, after Russia's
    // fill has been clipped to just the Asian side) would still be drawn as
    // a stray line with no landmass behind it. For Russia specifically,
    // require BOTH sides of a shared border to actually be rendered;
    // everything else keeps the normal "either side is rendered" rule so
    // retained countries still get an outer boundary line against
    // unrendered/filtered neighbors.
    const RU_ID = ISO_NUMERIC.RU;
    const russiaIsClipped = region.russiaMaxLon != null || region.russiaMinLon != null;
    const borders = topojson.mesh(geoData, geoData.objects.countries, (a, b) => {
      if (a === b) return false;
      if (!isWorld && russiaIsClipped && (Number(a.id) === RU_ID || Number(b.id) === RU_ID)) return false;
      const aIn = retainedGeoms.has(a), bIn = retainedGeoms.has(b);
      return isWorld || aIn || bIn;
    });
    // "Both sides retained" isn't enough on its own: a neighbor can be fully
    // rendered (e.g. Georgia/Azerbaijan in the Asia view) while its entire
    // shared border with Russia sits in the half of Russia that just got
    // clipped away (west of the Urals) — that border has no Russian land
    // behind it anymore, so drawing it whole leaves a stray floating outline
    // (this — plus the same thing happening near Kaliningrad's longitude —
    // is exactly the artifact this was reported as). So Russia-touching
    // borders are pulled out separately here and geographically clipped to
    // the same retained half as Russia's own fill, the same way its fill
    // was clipped above.
    if (!isWorld && russiaIsClipped) {
      const ruMesh = topojson.mesh(geoData, geoData.objects.countries, (a, b) => {
        if (a === b) return false;
        if (!(Number(a.id) === RU_ID || Number(b.id) === RU_ID)) return false;
        return retainedGeoms.has(a) && retainedGeoms.has(b);
      });
      const threshold = region.russiaMaxLon != null ? region.russiaMaxLon : region.russiaMinLon;
      const keepEast = region.russiaMinLon != null;
      const ruClipped = ruMesh.coordinates.flatMap(line => clipLineByLon(line, threshold, keepEast));
      borders.coordinates.push(...ruClipped);
    }

    g.append('g').attr('id','countries-g')
      .selectAll('path').data(countryFeatures).join('path')
      .attr('d', path)
      .attr('fill', S.landColor)
      .attr('stroke', S.borderColor)
      .attr('stroke-width', isWorld ? 0.25 : 0.3);

    g.append('path').attr('id','borders-path').datum(borders).attr('d', path)
      .attr('fill','none').attr('stroke', S.borderColor)
      .attr('stroke-width', isWorld ? 0.18 : 0.25);
  } else {
    // Placeholder group so later code that selects #countries-g still works
    g.append('g').attr('id','countries-g');
  }

  // USA mode: draw the land + state borders using the AlbersUsa projection.
  if (isUSA && usStatesData) {
    if (usQuizOn) {
      // States quiz: one clickable shape per state (same 10m atlas as the
      // counties, so the coastline is identical) instead of the county fill.
      const stateFeatures = topojson.feature(usStatesData, usStatesData.objects.states).features;
      attachQuizHandlers(
        g.select('#countries-g').selectAll('path')
          .data(stateFeatures).join('path')
          .attr('d', path)
          .attr('fill', S.landColor)
          .attr('stroke', S.borderColor)
          .attr('stroke-width', 0.15)
          .attr('stroke-opacity', 0.4),
        path, 'usa');
      attachQuizHitTargets(g, stateFeatures, path, 'usa');
    } else if (usCountiesData) {
      // County polygons give the most detailed coastline geometry
      const countyFeatures = topojson.feature(usCountiesData, usCountiesData.objects.counties);
      g.select('#countries-g').selectAll('path')
        .data(countyFeatures.features).join('path')
        .attr('d', path)
        .attr('fill', S.landColor)
        .attr('stroke', S.borderColor)
        .attr('stroke-width', 0.1)
        .attr('stroke-opacity', 0.35);
    }

    // State borders (internal)
    const stateMesh = topojson.mesh(usStatesData, usStatesData.objects.states, (a,b) => a !== b);
    g.append('path').attr('id','state-borders').datum(stateMesh).attr('d', path)
      .attr('fill','none').attr('stroke', S.borderColor).attr('stroke-width', 0.5)
      .attr('stroke-opacity', 0.8);

    // Outer US border (slightly bolder)
    const nationMesh = topojson.mesh(usStatesData, usStatesData.objects.states, (a,b) => a === b);
    g.append('path').attr('id','nation-border').datum(nationMesh).attr('d', path)
      .attr('fill','none').attr('stroke', S.borderColor).attr('stroke-width', 0.9);

    // Hover-outline overlay for the states quiz (same idea as the Japan one
    // below): appended last so it sits above the state-border mesh.
    if (usQuizOn) quizHoverOutline = g.append('path').attr('id', 'quizHoverOutline');
  }

  // Japan mode: draw all 47 prefectures (each a MultiPolygon, so every
  // outlying island is included) + prefecture borders using the region's
  // own Mercator projection
  if (isJapan && japanPrefData) {
    const prefFeatures = topojson.feature(japanPrefData, japanPrefData.objects.japan).features;
    attachQuizHandlers(
      g.select('#countries-g').selectAll('path')
        .data(prefFeatures).join('path')
        .attr('d', path)
        .attr('fill', S.landColor)
        .attr('stroke', S.borderColor)
        .attr('stroke-width', 0.15)
        .attr('stroke-opacity', 0.4),
      path, 'japan');
    attachQuizHitTargets(g, prefFeatures, path, 'japan');

    // Prefecture borders (internal)
    const prefMesh = topojson.mesh(japanPrefData, japanPrefData.objects.japan, (a,b) => a !== b);
    g.append('path').attr('id','pref-borders').datum(prefMesh).attr('d', path)
      .attr('fill','none').attr('stroke', S.borderColor).attr('stroke-width', 0.5)
      .attr('stroke-opacity', 0.8);

    // Outer national border (slightly bolder)
    const jpNationMesh = topojson.mesh(japanPrefData, japanPrefData.objects.japan, (a,b) => a === b);
    g.append('path').attr('id','nation-border-jp').datum(jpNationMesh).attr('d', path)
      .attr('fill','none').attr('stroke', S.borderColor).attr('stroke-width', 0.9);

    // Hover-outline overlay for the prefecture quiz: a single reusable path,
    // appended last so it always sits above the border mesh above, whose 'd'
    // is swapped to match whichever prefecture is under the cursor (see the
    // mouseenter/mouseleave handlers on the prefecture paths above). Kept
    // invisible (stroke-opacity:0, see CSS) until then.
    quizHoverOutline = g.append('path').attr('id', 'quizHoverOutline');
  }

  // Spain quiz: one clickable shape per province / autonomous city, drawn in
  // place of the plain country outline used in Normal mode.
  if (spainQuizOn && spainRegionData) {
    const esProv = spainRegionData.objects.provinces;
    const esComm = spainRegionData.objects.autonomous_regions; // may be absent
    const esFeatures = topojson.feature(spainRegionData, esProv).features;
    attachQuizHandlers(
      g.select('#countries-g').selectAll('path')
        .data(esFeatures).join('path')
        .attr('d', path)
        .attr('fill', S.landColor)
        .attr('stroke', S.borderColor)
        .attr('stroke-width', 0.15)
        .attr('stroke-opacity', 0.4),
      path, 'spain');
    attachQuizHitTargets(g, esFeatures, path, 'spain');

    // Province borders (internal, thin)
    const esMesh = topojson.mesh(spainRegionData, esProv, (a, b) => a !== b);
    g.append('path').attr('id', 'spain-borders').datum(esMesh).attr('d', path)
      .attr('fill', 'none').attr('stroke', S.borderColor).attr('stroke-width', 0.4)
      .attr('stroke-opacity', 0.7);
    // Autonomous-community borders on top, slightly bolder, for orientation
    if (esComm) {
      const commMesh = topojson.mesh(spainRegionData, esComm, (a, b) => a !== b);
      g.append('path').attr('id', 'spain-community-borders').datum(commMesh).attr('d', path)
        .attr('fill', 'none').attr('stroke', S.borderColor).attr('stroke-width', 0.8)
        .attr('stroke-opacity', 0.9).style('pointer-events', 'none');
    }
    // Outer coastline / national border
    const esOuter = topojson.mesh(spainRegionData, esProv, (a, b) => a === b);
    g.append('path').attr('id', 'nation-border-es').datum(esOuter).attr('d', path)
      .attr('fill', 'none').attr('stroke', S.borderColor).attr('stroke-width', 0.9);

    // Hover-outline overlay (same idea as the Japan / US quizzes)
    quizHoverOutline = g.append('path').attr('id', 'quizHoverOutline');
  }

  // Poland quiz: one clickable shape per voivodeship, drawn in place of the
  // plain country outline used in Normal mode. The source is plain GeoJSON with
  // no shared-border topology, and building one at runtime (topojson.topology)
  // takes ~20 s on a file this size and freezes the page — so each shape simply
  // carries its own outline stroke instead.
  if (polandQuizOn && polandRegionData) {
    const plFeatures = polandRegionData.features;
    plFeatures.forEach(fixInvertedWinding);
    attachQuizHandlers(
      g.select('#countries-g').selectAll('path')
        .data(plFeatures).join('path')
        .attr('d', path)
        .attr('fill', S.landColor)
        .attr('stroke', S.borderColor)
        .attr('stroke-width', 0.6)
        .attr('stroke-opacity', 0.8)
        .attr('stroke-linejoin', 'round'),
      path, 'poland');
    attachQuizHitTargets(g, plFeatures, path, 'poland');
    // Hover-outline overlay (same idea as the Japan / US / Spain quizzes)
    quizHoverOutline = g.append('path').attr('id', 'quizHoverOutline');
  }

  // For regional views, use d3's native translateExtent so the user can't drag
  // the region's bounding box out of view (the world map and USA, which use a
  // different projection with no lon/lat clip box, remain freely pannable).
  zoomBehavior.extent([[0, 0], [W, H]]);
  if (!isWorld && region.clip) {
    const [lon0, lat0, lon1, lat1] = region.clip;
    const corners = [
      projection([lon0, lat1]),
      projection([lon1, lat1]),
      projection([lon0, lat0]),
      projection([lon1, lat0]),
    ].filter(Boolean);
    if (corners.length === 4) {
      const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
      // Padding around the clip box's edges, so panning doesn't stop exactly
      // at the continent's boundary — territories that sit just outside it
      // (e.g. the Canary Islands south of mainland Europe) stay comfortably
      // reachable instead of being stranded right at the edge of the screen.
      const pad = Math.min(W, H) * 0.3;
      const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
      const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
      if (region.symmetricPan) {
        // Treat the screen centre (where the map first appears) as 0 and allow
        // the same panning distance up, down, left and right. The distance is
        // the largest of the four edge distances, so no side gets any smaller.
        const cx = W / 2, cy = H / 2;
        const r = Math.max(cx - x0, x1 - cx, cy - y0, y1 - cy);
        zoomBehavior.translateExtent([[cx - r, cy - r], [cx + r, cy + r]]);
      } else {
        zoomBehavior.translateExtent([[x0, y0], [x1, y1]]);
      }
    } else {
      zoomBehavior.translateExtent([[-Infinity,-Infinity],[Infinity,Infinity]]);
    }
  } else {
    zoomBehavior.translateExtent([[-Infinity,-Infinity],[Infinity,Infinity]]);
  }

  svg.call(zoomBehavior).on('dblclick.zoom', null);

  // Physical mode overlays a real satellite basemap in place of the flat
  // land/sea colours; it's applied here so region/resize redraws keep it too.
  await updatePhysicalLayer(g, W, H);

  // Redraw existing dots on new projection
  found.forEach(city => {
    svg.select('#' + dotId(city)).remove();
    addDot(city);
  });
  resizeNightCanvas();
  drawNightCanvas();
}

// ─── PHYSICAL MODE (satellite basemap) ───────────────────────────────────────
// Reprojects a real whole-Earth photo composite onto whatever projection the
// current region/zoom is using, pixel by pixel, so it lines up with the
// vector borders and dots exactly like the flat colour fills normally do.
// NOTE: this must be served from a host that sends CORS headers (Access-Control-Allow-Origin),
// or the canvas.getImageData() call below will throw and physical mode will silently fail.
// NASA's own eoimages.gsfc.nasa.gov does NOT send those headers. The first URL below is an
// 8192x4096 equirectangular Earth texture (NASA Blue Marble elevation/imagery data, via
// Solar System Scope, CC-BY-4.0) mirrored through jsDelivr's GitHub CDN, which always adds
// Access-Control-Allow-Origin: * — 16x the pixel count of the old three-globe texture, so it
// stays sharp even zoomed into a single country instead of just going blurry/blocky. The
// remaining URLs are lower-res fallbacks tried in order if that one is ever unreachable.
const PHYSICAL_IMG_URLS = [
  'https://cdn.jsdelivr.net/gh/Ornstein89/paraview_orbit@main/8k_earth_daymap.jpg',
  'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
  'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg',
];
let _physicalSource = null;       // cached decoded source pixels: {data, width, height}
let _physicalLoadPromise = null;

function loadImageAndReadPixels(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      // Use the image at full native resolution — physical mode's own bilinear
      // sampling (see renderPhysicalBasemap) is what actually determines sharpness
      // when zoomed in, so there's no benefit to throwing away source detail here.
      const sw = img.naturalWidth;
      const sh = img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, sw, sh);
      let imgData;
      try {
        imgData = ctx.getImageData(0, 0, sw, sh);
      } catch (e) {
        console.error('Physical mode: canvas read blocked (CORS) for', url, e);
        reject(new Error('Blocked reading image data (CORS): ' + url)); return;
      }
      resolve({ data: imgData.data, width: sw, height: sh });
    };
    img.onerror = (ev) => {
      console.error('Physical mode: image failed to load from', url, ev);
      reject(new Error('Could not load satellite image: ' + url));
    };
    img.src = url;
  });
}

async function loadPhysicalSource() {
  if (_physicalSource) return _physicalSource;
  if (_physicalLoadPromise) return _physicalLoadPromise;
  _physicalLoadPromise = (async () => {
    let lastErr;
    for (const url of PHYSICAL_IMG_URLS) {
      try {
        const src = await loadImageAndReadPixels(url);
        _physicalSource = src;
        return src;
      } catch (e) {
        lastErr = e;
      }
    }
    // All sources failed — let the next attempt retry from scratch instead of
    // being stuck on a rejected promise forever.
    _physicalLoadPromise = null;
    throw lastErr;
  })();
  return _physicalLoadPromise;
}

// ─── PHYSICAL MODE — satellite tiles (preferred) ─────────────────────────────
// The whole-Earth 8k texture above is a fallback only. The sharper image is
// built from real map tiles — small 256x256 JPEGs from a NASA Blue Marble
// tile pyramid (public domain, Web Mercator/EPSG:3857, zoom levels 0-8,
// mirrored with CORS enabled via jsDelivr's GitHub CDN) — fetched for just
// the patch of the globe currently on screen. This now engages at every
// zoom level (see MIN_TILE_ZOOM_TO_ENGAGE below), with the 8k texture only
// used as a per-pixel fallback if a given tile fails to load. Higher zoom =
// a deeper (sharper) tile level, up to the pyramid's max, so the image keeps
// resolving more detail as you zoom in.
const TILE_URL_TEMPLATE = 'https://cdn.jsdelivr.net/gh/freetiler/nasa-bluemarble/tiles/{z}/{x}/{y}.jpeg';
const MAX_TILE_ZOOM = 8;         // deepest zoom level the tile set publishes
const MIN_TILE_ZOOM_TO_ENGAGE = 0; // engage the sharper tile pyramid at every zoom level; the blurrier whole-earth texture is now only a fallback for when tiles fail to load
const MAX_TILES_PER_FETCH = 144;   // safety cap (12x12) so an odd view can't trigger a huge fetch
const MERCATOR_LAT_LIMIT = 85.05112878; // Web Mercator's own coverage limit

const _tileImageCache = new Map(); // 'z/x/y' -> Promise<HTMLImageElement|null>
function loadTileImage(z, x, y) {
  const n = Math.pow(2, z);
  x = ((x % n) + n) % n; // longitude tiles wrap around the globe
  if (y < 0 || y >= n) return Promise.resolve(null); // no tiles beyond the poles
  const key = z + '/' + x + '/' + y;
  if (_tileImageCache.has(key)) return _tileImageCache.get(key);
  const p = new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null); // missing/failed tile — caller falls back gracefully
    img.src = TILE_URL_TEMPLATE.replace('{z}', z).replace('{x}', x).replace('{y}', y);
  });
  _tileImageCache.set(key, p);
  return p;
}

// Fetches every tile in [xMin..xMax] x [yMin..yMax] at zoom z and composites
// them into one canvas ("mosaic") so the main render loop can bilinear-sample
// across tile boundaries exactly like it already does for the base texture.
async function loadTileMosaic(z, xMin, xMax, yMin, yMax) {
  const nx = xMax - xMin + 1, ny = yMax - yMin + 1;
  const canvas = document.createElement('canvas');
  canvas.width = nx * 256; canvas.height = ny * 256;
  const ctx = canvas.getContext('2d');
  const tileOk = new Array(nx * ny).fill(false);
  const jobs = [];
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const tx = xMin + i, ty = yMin + j;
      jobs.push(loadTileImage(z, tx, ty).then(img => {
        if (img) { ctx.drawImage(img, i * 256, j * 256); tileOk[j * nx + i] = true; }
      }));
    }
  }
  await Promise.all(jobs);
  if (!tileOk.some(Boolean)) return null; // every tile in range failed — nothing usable
  let imgData;
  try {
    imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } catch (e) {
    return null; // CORS-tainted canvas or similar — bail out to the base texture
  }
  return { data: imgData.data, width: canvas.width, height: canvas.height, nx, ny, xMin, yMin, z, tileOk };
}

function lonToTileX(lon, n) { return (lon + 180) / 360 * n; }
function latToTileY(lat, n) {
  const latClamped = Math.max(-MERCATOR_LAT_LIMIT, Math.min(MERCATOR_LAT_LIMIT, lat));
  const rad = latClamped * Math.PI / 180;
  return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
}

// Decides whether the current view is zoomed in enough to bother fetching
// tiles, and if so, which zoom level and tile range cover what's on screen —
// then fetches and composites them. Returns null (meaning "just use the base
// texture") whenever tiles wouldn't help, aren't needed, or fail to load.
async function computePhysicalTileSource(W, H) {
  // A tile pyramid's zoom z packs the whole 360°-wide world into 256*2^z
  // pixels — comparing that to the current view's effective scale tells us
  // the shallowest (cheapest) zoom level that's at least as detailed as what
  // the base texture already provides, so tiles only kick in once they'd
  // actually add sharpness. This is exact for the Mercator regional views
  // and a reasonable stand-in for the World/USA composite projections.
  const effScale = projection.scale() * currentTransform.k;
  let z = 0;
  while (z < MAX_TILE_ZOOM && (256 * Math.pow(2, z)) / (2 * Math.PI) < effScale) z++;
  if (z < MIN_TILE_ZOOM_TO_ENGAGE) return null;

  // Sample a coarse grid across the viewport to find the lon/lat box that's
  // actually visible, so we only fetch the handful of tiles under it.
  const lons = [], lats = [];
  const STEPS = 6;
  for (let iy = 0; iy <= STEPS; iy++) {
    for (let ix = 0; ix <= STEPS; ix++) {
      const p = projection.invert(currentTransform.invert([ix / STEPS * W, iy / STEPS * H]));
      if (p && isFinite(p[0]) && isFinite(p[1]) && p[1] <= 90 && p[1] >= -90) { lons.push(p[0]); lats.push(p[1]); }
    }
  }
  if (!lons.length) return null;

  const n = Math.pow(2, z);
  let xMin = Math.floor(lonToTileX(Math.min(...lons), n));
  let xMax = Math.floor(lonToTileX(Math.max(...lons), n));
  let yMin = Math.floor(latToTileY(Math.max(...lats), n));
  let yMax = Math.floor(latToTileY(Math.min(...lats), n));
  // Pad by one tile so bilinear sampling near the view's edges still has real
  // neighbouring pixels to blend with instead of hitting a hard clamp.
  xMin = Math.max(0, xMin - 1); xMax = Math.min(n - 1, xMax + 1);
  yMin = Math.max(0, yMin - 1); yMax = Math.min(n - 1, yMax + 1);
  if (xMax < xMin || yMax < yMin) return null;
  if ((xMax - xMin + 1) * (yMax - yMin + 1) > MAX_TILES_PER_FETCH) return null; // odd/huge view — skip this pass

  try {
    return await loadTileMosaic(z, xMin, xMax, yMin, yMax);
  } catch (e) {
    console.error('Physical mode: tile fetch failed, falling back to base texture', e);
    return null;
  }
}

// Shared bilinear sampler for both the base equirectangular texture (which
// wraps horizontally around the globe) and a tile mosaic (which doesn't —
// its edges are simply clamped).
function bilinearSample(data, width, height, xf, yf, wrapX) {
  let x0 = Math.floor(xf), y0 = Math.floor(yf);
  const tx = xf - x0, ty = yf - y0;
  let x1 = x0 + 1;
  const y1 = Math.min(height - 1, Math.max(0, y0 + 1));
  y0 = Math.min(height - 1, Math.max(0, y0));
  if (wrapX) {
    x0 = ((x0 % width) + width) % width;
    x1 = ((x1 % width) + width) % width;
  } else {
    x0 = Math.min(width - 1, Math.max(0, x0));
    x1 = Math.min(width - 1, Math.max(0, x1));
  }
  const i00 = (y0 * width + x0) * 4, i10 = (y0 * width + x1) * 4;
  const i01 = (y1 * width + x0) * 4, i11 = (y1 * width + x1) * 4;
  const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
  return [
    data[i00]   * w00 + data[i10]   * w10 + data[i01]   * w01 + data[i11]   * w11,
    data[i00+1] * w00 + data[i10+1] * w10 + data[i01+1] * w01 + data[i11+1] * w11,
    data[i00+2] * w00 + data[i10+2] * w10 + data[i01+2] * w01 + data[i11+2] * w11,
  ];
}

// Builds the reprojected raster and inserts it as an <image> in the
// untransformed #physical-g layer (a sibling of #map-g, not the pan/zoom
// group), so it's always redrawn crisp for the current view — a raster
// dropped inside the zoom-transformed group would just get stretched and
// go blocky as the user zooms in, the way a bitmap always does under a
// CSS/SVG scale transform.
async function renderPhysicalBasemap(W, H) {
  const src = await loadPhysicalSource();
  const { data: sData, width: sw, height: sh } = src;
  // Zoomed in far enough, fetch real map tiles for just the visible patch of
  // the globe so detail keeps increasing instead of plateauing at the base
  // texture's fixed resolution (see computePhysicalTileSource for the cutoff).
  const tileSrc = await computePhysicalTileSource(W, H);
  // Render extra pixels-per-CSS-pixel on high-DPI (retina) screens so the
  // basemap looks as crisp as the rest of the (vector) UI there, instead of
  // being visibly softer than everything around it. Capped both in ratio and
  // in total sample count so this stays fast on a large/maximized map pane.
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * dpr * dpr > 4_000_000) dpr = 1;
  const rw = Math.round(W * dpr), rh = Math.round(H * dpr);
  const canvas = document.createElement('canvas');
  canvas.width = rw; canvas.height = rh;
  const ctx = canvas.getContext('2d');
  const target = ctx.createImageData(rw, rh);
  const tData = target.data;
  const tileN = tileSrc ? Math.pow(2, tileSrc.z) : 0;
  for (let y = 0; y < rh; y++) {
    for (let x = 0; x < rw; x++) {
      // Undo the current pan/zoom transform first so each screen pixel maps
      // to the right point in the base (untransformed) projection, then to
      // lon/lat — this is what keeps the basemap aligned and sharp at any
      // zoom level instead of being a fixed image stretched by the transform.
      const screenPt = currentTransform.invert([(x + 0.5) / dpr, (y + 0.5) / dpr]);
      const p = projection.invert(screenPt);
      if (!p || !isFinite(p[0]) || !isFinite(p[1]) || p[1] > 90 || p[1] < -90) continue;
      const lon = ((p[0] + 180) % 360 + 360) % 360 - 180;
      const lat = p[1];

      let rgb = null;
      if (tileSrc) {
        const txf = lonToTileX(lon, tileN) - tileSrc.xMin;
        const tyf = latToTileY(lat, tileN) - tileSrc.yMin;
        const tileCol = Math.floor(txf), tileRow = Math.floor(tyf);
        if (tileCol >= 0 && tileCol < tileSrc.nx && tileRow >= 0 && tileRow < tileSrc.ny &&
            tileSrc.tileOk[tileRow * tileSrc.nx + tileCol]) {
          rgb = bilinearSample(tileSrc.data, tileSrc.width, tileSrc.height, txf * 256, tyf * 256, false);
        }
      }
      if (!rgb) {
        // Bilinear sample instead of nearest-neighbor for a smoother look.
        const sxf = (lon + 180) / 360 * sw - 0.5;
        const syf = (90 - lat) / 180 * sh - 0.5;
        rgb = bilinearSample(sData, sw, sh, sxf, syf, true);
      }
      const ti = (y * rw + x) * 4;
      tData[ti] = rgb[0]; tData[ti+1] = rgb[1]; tData[ti+2] = rgb[2]; tData[ti+3] = 255;
    }
  }
  ctx.putImageData(target, 0, 0);
  const physicalG = svg.select('#physical-g');
  physicalG.select('#physicalImg').remove();
  physicalG.append('image')
    .attr('id', 'physicalImg')
    .attr('x', 0).attr('y', 0)
    .attr('width', W).attr('height', H)
    .attr('preserveAspectRatio', 'none')
    .attr('href', canvas.toDataURL('image/jpeg', 0.92));
  // This render is now the ground truth for the current view — clear the
  // live "catch-up" transform onZoom() applies between renders, and remember
  // this transform so the next one knows how far the view has since moved.
  physicalG.style('transform', null);
  _physicalBakedTransform = currentTransform;
}

// Turns the satellite layer on/off against a map group that already has its
// #sphere and #countries-g elements — used both by drawMap() and by the
// Physical mode checkbox (so toggling it doesn't need a full map rebuild).
async function updatePhysicalLayer(g, W, H) {
  svg.select('#physical-g').select('#physicalImg').remove();
  if (!S.physicalMode) {
    g.select('#sphere').attr('fill', S.seaColor);
    g.select('#countries-g').selectAll('path').attr('fill', S.landColor).attr('stroke', S.borderColor);
    g.select('#borders-path').attr('stroke', S.borderColor);
    g.select('#state-borders').attr('stroke', S.borderColor);
    g.select('#nation-border').attr('stroke', S.borderColor);
    g.select('#pref-borders').attr('stroke', S.borderColor);
    g.select('#nation-border-jp').attr('stroke', S.borderColor);
    document.getElementById('mapWrap').style.background = S.seaColor;
    return;
  }
  g.select('#sphere').attr('fill', 'none');
  g.select('#countries-g').selectAll('path').attr('fill', 'none').attr('stroke', 'none');
  g.select('#borders-path').attr('stroke', 'none');
  g.select('#state-borders').attr('stroke', 'none');
  g.select('#nation-border').attr('stroke', 'none');
  g.select('#pref-borders').attr('stroke', 'none');
  g.select('#nation-border-jp').attr('stroke', 'none');
  document.getElementById('mapWrap').style.background = '#05070c';
  setMsg('Loading satellite imagery…', 'info');
  try {
    if (!W || !H) [W, H] = getMapSize();
    await renderPhysicalBasemap(W, H);
    setMsg('Satellite imagery loaded.', 'info');
  } catch (err) {
    console.error(err);
    setMsg('Could not load satellite imagery (check your connection).', 'err');
    S.physicalMode = false;
    const chk = document.getElementById('physicalMode');
    if (chk) chk.checked = false;
    g.select('#sphere').attr('fill', S.seaColor);
    g.select('#countries-g').selectAll('path').attr('fill', S.landColor).attr('stroke', S.borderColor);
    g.select('#borders-path').attr('stroke', S.borderColor);
    g.select('#state-borders').attr('stroke', S.borderColor);
    g.select('#nation-border').attr('stroke', S.borderColor);
    g.select('#pref-borders').attr('stroke', S.borderColor);
    g.select('#nation-border-jp').attr('stroke', S.borderColor);
    document.getElementById('mapWrap').style.background = S.seaColor;
  }
}

// ─── COORDINATE PARSER ───────────────────────────────────────────────────────
// Accepts multiple formats:
//   Plain decimal:       49.2827  or  -122.7932
//   DMS with dots:       49.16.58.72  (DD.MM.SS.ss)  → also handles DD.MM.SS
//   DMS with symbols:    49°16'58.72"N  or  49° 16' 58.72" N
//   Signed or N/S/E/W suffix/prefix
function parseDMS(val) {
  if (val === null || val === undefined || val === '') return NaN;
  const s = String(val).trim();

  // Determine sign from leading minus or N/S/E/W suffix
  const neg = /^-/.test(s) || /[SsWw]$/.test(s);

  // Strip direction letters and degree/minute/second symbols
  const clean = s.replace(/[NSEWnsew°'"]/g, '').replace(/\s+/g,'').trim();

  // If only one dot → plain decimal  e.g. "49.2827" or "-122.7932"
  const dots = (clean.match(/\./g) || []).length;
  if (dots <= 1) {
    const v = parseFloat(clean);
    if (isNaN(v)) return NaN;
    // Integer-encoded coordinate (no dot, value out of ±180 range) → divide by 100000
    if (dots === 0 && Math.abs(v) > 180) return neg && v > 0 ? -(v / 100000) : v / 100000;
    return neg && v > 0 ? -v : v;
  }

  // Two or more dots → DMS encoded with dots as separators
  // Supported formats:
  //   DD.MM.SS        → parts[0]=deg, parts[1]=min (2 chars), parts[2]=sec integer
  //   DD.MM.SS.sss    → same + parts[3]=sec fractional
  //   DD.MMSSi.sss    → parts[1] is MMSS combined (>2 chars): first 2=min, rest=sec int, parts[2]=sec frac
  //   e.g. "4.250.729" → ['4','250','729'] → deg=4, min=25, sec=0.729
  //   e.g. "49.16.58"  → ['49','16','58']  → deg=49, min=16, sec=58
  //   e.g. "49.16.58.72" → deg=49, min=16, sec=58.72

  const parts = clean.split('.');
  let deg, min, sec;

  deg = parseInt(parts[0], 10);

  if (parts[1].length > 2) {
    // Compact format: MMSS in one segment e.g. "250" → min=25, secInt=0
    min = parseInt(parts[1].slice(0, 2), 10);
    const secInt = parts[1].slice(2) || '0';
    sec = parseFloat(secInt + (parts[2] !== undefined ? '.' + parts[2] : ''));
  } else {
    // Normal: separate MM and SS segments
    min = parseInt(parts[1], 10);
    // parts[2] onwards form the seconds value
    sec = parts.length >= 3 ? parseFloat(parts.slice(2).join('.')) : 0;
  }

  if (isNaN(deg) || isNaN(min) || isNaN(sec)) return NaN;
  const decimal = Math.abs(deg) + min / 60 + sec / 3600;
  return neg ? -decimal : decimal;
}

// ─── DISPLAY NAMES (local-language spellings) ────────────────────────────────
// City data comes from GeoNames, whose "name" column is often the common
// English exonym (e.g. "Turin", "Munich") rather than the name used in the
// country itself. For display purposes only — never for search/matching,
// which still runs against the original GeoNames name — we prefer the local
// spelling, but only where it's still written in the Latin alphabet (so e.g.
// "Moscow"/"Athens" are left alone rather than switching to Cyrillic/Greek).
// Keyed by the lowercased GeoNames name; add more pairs here as needed.
const LOCAL_NAME_OVERRIDES = {
  'rome':'Roma', 'turin':'Torino', 'milan':'Milano', 'naples':'Napoli',
  'florence':'Firenze', 'venice':'Venezia', 'genoa':'Genova', 'padua':'Padova',
  'vienna':'Wien', 'munich':'München', 'cologne':'Köln', 'nuremberg':'Nürnberg',
  'hanover':'Hannover',
  'prague':'Praha', 'warsaw':'Warszawa', 'cracow':'Kraków', 'krakow':'Kraków',
  'lisbon':'Lisboa', 'seville':'Sevilla',
  'zurich':'Zürich', 'geneva':'Genève', 'basle':'Basel',
  'brussels':'Bruxelles', 'antwerp':'Antwerpen',
  'copenhagen':'København', 'gothenburg':'Göteborg',
  'the hague':'Den Haag',
  'bucharest':'București', 'belgrade':'Beograd',
  'marseilles':'Marseille', 'dunkirk':'Dunkerque',
};
// Japanese municipality names in this data sometimes carry the "-shi" (市,
// "city") suffix baked in — e.g. "Fukui-shi", "Nara-shi" — which is never
// how a person would actually type or expect to see these names (nobody
// calls it "Fukui-shi" in casual English; see isJPPrefCapital's jpCapitalKey
// for the matching-side counterpart of this same quirk). Strip it for
// display only; search/matching still runs against the original name.
function stripJPShiSuffix(name) {
  return name.replace(/-shi$/i, '');
}
function displayName(city) {
  let name = LOCAL_NAME_OVERRIDES[city.name.toLowerCase()] || city.name;
  if (city.country === 'JP') name = stripJPShiSuffix(name);
  return name;
}

// #fileStatus only exists while the found-list empty-state overlay is showing
// (it's rebuilt into the "Load data file" button) — guard against it being absent.
function setFileStatus(text) {
  const el = document.getElementById('fileStatus');
  if (el) el.textContent = text;
}
document.getElementById('fileInput').onchange = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const isTxt = file.name.endsWith('.txt') || file.name.endsWith('.tsv');
  const reader = new FileReader();
  if (isTxt) {
    reader.onload = function(ev) { loadCitiesFromTSV(ev.target.result); };
    reader.readAsText(file, 'utf-8');
  } else {
    reader.onload = function(ev) { loadCitiesFromBuffer(ev.target.result); };
    reader.readAsArrayBuffer(file);
  }
};

function finaliseCityDB(swappedCount) {
  // Inject cities missing from cities15000 but important enough to include
  const MISSING_CITIES = [
    { name:'El Alto', ascii_name:'El Alto', nameF:'el alto', asciiF:'el alto', aliases:['el alto'], aliasesF:['el alto'], lat:-16.5006, lon:-68.1762, country:'BO', admin1:'04', pop:1183483, isCapital:false },
  ];
  MISSING_CITIES.forEach(mc => {
    if (!cityDB.some(c => c.ascii_name === mc.ascii_name && c.country === mc.country)) {
      cityDB.push(mc);
    }
  });

  // GeoNames IDs of entries to exclude (neighbourhoods, duplicates, bad data)
  const EXCLUDED_GEONAMES_IDS = new Set([
    4274994,  // Manhattan, KS (small town — alias removal handles NYC Manhattan)
    5125771,  // Manhattan, NY (borough — New York City is the correct entry)
    5110302,  // Brooklyn, NY (borough)

    4684724,  // Cypress, TX (unincorporated community)
    5341256,  // Cypress, CA (unincorporated community)
    5317071,  // Tempe Junction, AZ
    4619947,  // East Chattanooga, TN
    5405288,  // Valencia, CA (unincorporated community)

    4929022,  // Amherst, MA
    5107129,  // Amherst, NY
    4839745,  // North Stamford, CT
    4903976,  // North Peoria, IL
  ]);
  cityDB = cityDB.filter(c => !EXCLUDED_GEONAMES_IDS.has(c.geonamesId));

  const cset = new Set(cityDB.map(c=>c.country));
  countriesList = [...cset].sort((a,b) => fmtCountry(a).localeCompare(fmtCountry(b)));
  populateCountryFilterOptions();
  // Always reset to 'any' on file load — avoids stale 'specific' filter locking out all results
  S.countryMode = 'any';

  renderFoundGrid(); // swap the empty-state "Load data file" button for the plain city prompt now that data is loaded

  const swapNote = swappedCount > 0 ? ` (auto-fixed ${swappedCount} swapped lat/lon)` : '';
  setMsg(`Loaded ${cityDB.length} cities from ${countriesList.length} countries${swapNote}.`, 'info');
  renderOtherStats();
}

// Shared, never-mutated placeholder for cities with no alternate names — avoids
// allocating a fresh empty array (and a throwaway Set) per row for what is the
// common case, especially for the small towns that make up most of a cities500 export.
const EMPTY_ALIASES_F = [];

function loadCitiesFromTSV(text) {
  try {
    const lines = text.split('\n');
    let swappedCount = 0;
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line || line.charCodeAt(0) === 35 /* '#' */) continue; // cheap skip for blank/comment lines
      const r = line.split('\t');
      if (r.length < 9) continue;
      // Two possible column layouts land here:
      //  - a full/raw GeoNames export (>=15 cols): 0=id,1=name,2=asciiname,
      //    3=alternatenames,4=lat,5=lon,6=featureclass,7=featurecode,
      //    8=countrycode,10=admin1,14=population — e.g. a manually uploaded
      //    cities15000.txt straight from GeoNames.
      //  - the slim export update-cities.yml produces (10 cols, unused
      //    GeoNames columns like elevation/timezone/admin2-4 stripped to
      //    shrink the download): 0=id,1=name,2=asciiname,3=alternatenames,
      //    4=lat,5=lon,6=featurecode,7=countrycode,8=admin1,9=population
      const isSlim = r.length < 15;
      const featureCode = (isSlim ? r[6] : r[7]).trim();
      if (featureCode === 'PPLX') continue; // skip neighbourhoods/districts
      const name       = r[1].trim();
      if (!name) continue;
      const asciiRaw   = r[2].trim();
      const ascii_name = asciiRaw || name;
      const altField   = r[3];
      const aliases    = altField ? altField.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean) : [];
      const country    = (isSlim ? r[7] : r[8]).trim();
      const admin1     = ((isSlim ? r[8] : r[10]) || '').trim().toUpperCase();
      const pop        = parseInt(isSlim ? r[9] : r[14]) || 0;
      let lat = parseFloat(r[4]);
      let lon = parseFloat(r[5]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const latOk = lat >= -90 && lat <= 90;
      const lonOk = lon >= -180 && lon <= 180;
      if (!latOk && lonOk && lon >= -90 && lon <= 90 && lat >= -180 && lat <= 180) {
        [lat, lon] = [lon, lat]; swappedCount++;
      } else if (!latOk || !lonOk) continue;
      const disputedCap = DISPUTED_CAPITALS[country];
      const isCapital = (featureCode === 'PPLC' && (!disputedCap || disputedCap === ascii_name)) || disputedCap === ascii_name;
      const nameF = fold(name);
      // Most rows have no ASCII transliteration to fold separately — reuse nameF.
      const asciiF = asciiRaw && asciiRaw !== name ? fold(ascii_name) : nameF;
      const mxAliases = country === 'MX' && pop >= 50000 ? getMexicanAliases(name) : null;
      const aliasesF = (aliases.length || mxAliases)
        ? [...new Set([...aliases.map(fold), ...(mxAliases || [])])]
        : EMPTY_ALIASES_F;
      const geonamesId = parseInt(r[0]);
      out.push({ name, ascii_name, nameF, asciiF, aliasesF, aliases, lat, lon, country, admin1, pop, isCapital, geonamesId });
    }
    cityDB = out;
    finaliseCityDB(swappedCount, 'txt');
  } catch(err) {
    setFileStatus('❌ Error reading file');
    setMsg('Could not read file: ' + err.message, 'err');
  }
}

function loadCitiesFromBuffer(buf) {
  try {
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', header:1});
      let swappedCount = 0;
      cityDB = rows.map(r => {
        const name       = String(r[0]||'').trim();
        const ascii_name = String(r[1]||r[0]||'').trim();
        const aliases    = String(r[2]||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
        const country    = String(r[5]||'').trim();
        const admin1     = String(r[10]||r[7]||'').trim().toUpperCase(); // col K (GeoNames) or H fallback
        const pop        = parseInt(r[6])||0;
        let lat = parseDMS(r[3]);
        let lon = parseDMS(r[4]);
        if (isNaN(lat) || isNaN(lon)) return null;
        // Some rows encode lat at 1e6 scale instead of 1e5, producing a value 10× too large.
        // Detect this by checking against the country's bounding box; if lat is out of range
        // but lat/10 lands inside, apply the correction (lon is always correctly 1e5-encoded).
        if (country && COUNTRY_LAT_BBOX[country]) {
          const [latMin, latMax] = COUNTRY_LAT_BBOX[country];
          if ((lat < latMin || lat > latMax) && lat/10 >= latMin && lat/10 <= latMax) {
            lat = lat / 10;
          }
        }
        // Auto-fix swapped lat/lon: lat must be -90..90, lon -180..180
        const latOk = lat >= -90 && lat <= 90;
        const lonOk = lon >= -180 && lon <= 180;
        if (!latOk && lonOk && lon >= -90 && lon <= 90 && lat >= -180 && lat <= 180) {
          [lat, lon] = [lon, lat];
          swappedCount++;
        } else if (!latOk || !lonOk) {
          return null;
        }
        const isCapital = DISPUTED_CAPITALS[country] === ascii_name || COUNTRY_CAPITALS[country] === ascii_name;
        const nameF = fold(name), asciiF = fold(ascii_name);
      const aliasesF = [...new Set([...aliases.map(fold), ...(country === 'MX' && pop >= 50000 ? getMexicanAliases(name) : [])])];
        return { name, ascii_name, nameF, asciiF, aliasesF, aliases, lat, lon, country, admin1, pop, isCapital };
      }).filter(c => c && c.name);
      if (swappedCount > 0) console.warn('Auto-fixed ' + swappedCount + ' rows with swapped lat/lon.');

      finaliseCityDB(swappedCount, 'xlsx');
    } catch(err) {
      setFileStatus('❌ Error reading file');
      setMsg('Could not read file: ' + err.message, 'err');
    }
}

// Reverse of ISO_NUMERIC (numeric code → ISO2), used to identify a rendered
// country-feature's ISO2 so regions can be restricted to their own country
// list (e.g. keeping Africa/Asia off the Europe map). Territories with no
// entry in ISO_NUMERIC (a handful of small/disputed ones, like Kosovo) simply
// have no reverse mapping and are left alone by that filter rather than risk
// being dropped incorrectly.
const NUM_TO_ISO = {};
for (const iso2 in ISO_NUMERIC) NUM_TO_ISO[ISO_NUMERIC[iso2]] = iso2;

// A handful of disputed territories (Kosovo, Northern Cyprus, ...) have no
// standard ISO 3166-1 numeric code, so their world-atlas feature id has no
// entry in NUM_TO_ISO above. The strictCountries filter used to treat an
// unrecognized id as "leave it alone, to be safe" — which was exactly
// backwards: it meant these territories leaked into every region's map
// (e.g. Kosovo and Northern Cyprus showing up on the Africa and Asia views)
// instead of only the one region that actually lists them. Since they can't
// be looked up by id, identify them by where they actually sit on the globe.
const DISPUTED_TERRITORY_BBOXES = [
  { iso2: 'XK', lon: [19.9, 21.9], lat: [41.8, 43.3] }, // Kosovo
  { iso2: 'CY', lon: [32.0, 34.7], lat: [34.9, 35.8] }, // Northern Cyprus — grouped with Cyprus for filtering
  { iso2: 'SO', lon: [42.0, 49.5], lat: [7.5, 11.8] },  // Somaliland — breakaway region, grouped with Somalia for filtering
  { iso2: 'FO', lon: [-8.0, -6.0], lat: [61.0, 63.0] }, // Faroe Islands — safety net in case this dataset gives it a non-standard id
];
function identifyDisputedTerritory(feature) {
  const [lon, lat] = d3.geoCentroid(feature);
  const hit = DISPUTED_TERRITORY_BBOXES.find(t =>
    lon >= t.lon[0] && lon <= t.lon[1] && lat >= t.lat[0] && lat <= t.lat[1]);
  return hit ? hit.iso2 : null;
}

// Returns the US state code (e.g. 'CA') if hint matches a state, else null.
function matchesUSState(hint) {

function matchesCountryHint(cityCode, hint) {
  const h = hint.trim().toLowerCase();

  const aliases = ISO_ALIASES[code];
  if (aliases && aliases.includes(h)) return true;

// Normalise a string for fuzzy matching:
// - lowercase
// - strip diacritics (ö→o, ü→u, é→e, ą→a, etc.)
// - treat hyphens and spaces as identical (so "bad kissingen" == "bad-kissingen")
// ─── MEXICAN CITY SHORT-NAME ALIASES ─────────────────────────────────────────
// Generates folded short-form aliases for Mexican cities by stripping common
// prefixes and connectors, so e.g. "Ciudad Juárez" → also matches "juarez",
// "Heroica Matamoros" → "matamoros", "Santiago de Querétaro" → "queretaro" etc.
function getMexicanAliases(name) {
  const f = fold(name);
  const extras = new Set();

  // Prefixes to strip (with optional "de/del/la/las/los/el" connector after)
  const prefixes = [
    'ciudad', 'heroica', 'heroico', 'villa de', 'villa', 'san luis',
    'santiago de', 'santiago', 'victoria de', 'victoria',
    'heroica ciudad de', 'ciudad de', 'municipio de',
    'general', 'el', 'la', 'los', 'las',
  ];

  for (const pfx of prefixes) {
    if (f.startsWith(pfx + ' ')) {
      let rest = f.slice(pfx.length).trim();
      // Also strip a leading "de/del/la/las/los/el" connector
      rest = rest.replace(/^de(l)? /, '').replace(/^(la|las|los|el) /, '');
      if (rest.length > 2) extras.add(rest);
    }
  }

  // Strip trailing " de <state>" or " de <something>" patterns
  const deMatch = f.match(/^(.+?) de .+$/);
  if (deMatch && deMatch[1].length > 2) extras.add(deMatch[1].trim());

  // If name has 3+ words, also add first-two-word short form (e.g. "san luis" for "San Luis Potosí")
  const words = f.split(' ');
  if (words.length >= 3) {
    const twoWord = words.slice(0, 2).join(' ');
    if (twoWord.length > 3) extras.add(twoWord);
  }

  extras.delete(f); // don't duplicate the full folded name
  return [...extras];
}

function fold(s) {

    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[-\s]+/g, ' ')
    .trim()
    .replace(/\bsaint\b/g, 'st')
    .replace(/\bsainte\b/g, 'st')
    .replace(/\.(?=\s|$)/g, '');
}

function lookupCity(raw) {
  if (!cityDB.length) return [];
  const q = fold(raw.trim());
  let hint = null, cityQuery = q;
  const ci = q.lastIndexOf(',');
  if (ci > 0) { cityQuery = q.slice(0,ci).trim(); hint = q.slice(ci+1).trim(); }

  const region = REGIONS[currentRegion];
  const stateCode = hint ? matchesUSState(hint) : null;

  function inScope(c) {
    if (!cityInRegion(c, region)) return false;
    if (S.countryMode === 'specific' && !hint && c.country !== S.specificCountry) return false;
    if (hint) {
      if (stateCode) return c.country === 'US' && c.admin1 === stateCode;
      return matchesCountryHint(c.country, hint);
    }
    return true;
  }

  function nameMatches(c, query) {
    return c.nameF === query ||
           c.asciiF === query ||
           c.aliasesF.some(a => a === query);
  }

  function prefixMatches(c, query) {
    return c.nameF.startsWith(query) ||
           c.asciiF.startsWith(query);
  }

  // Exact matches (with folding)
  let matches = cityDB.filter(c => nameMatches(c, cityQuery) && inScope(c));

  // Prefix fallback: accept only if all hits share the same folded city name (unambiguous)
  if (!matches.length) {
    const prefixHits = cityDB.filter(c => prefixMatches(c, cityQuery) && inScope(c));
    const distinctNames = new Set(prefixHits.map(c => fold(c.name)));
    if (prefixHits.length > 0 && distinctNames.size === 1) {
      matches = prefixHits;
    } else if (prefixHits.length > 0 && distinctNames.size > 1) {
      return []; // ambiguous prefix — force full name
    }
  }

  if (!matches.length) return [];

  // Priority order: (1) in-scope [already filtered above], (2) capitals,
  // (3) population. Implemented as a single score so the two interact
  // sensibly instead of capital being an absolute override:
  //   base tier — 2 for a real name/ascii exact match, 1 for an alias exact
  //   match, 0 for a bare prefix hit. A real name always outranks a mere
  //   alias of some OTHER city (e.g. Porto's own name beats Bordeaux, whose
  //   alternate-names list happens to include "porto" as a data quirk).
  //   +1 bonus if the city is the capital of a UN-recognized country — enough to lift a
  //   capital's alias match up to parity with a same-tier real-name match
  //   elsewhere (e.g. Andorra la Vella's "Andorra" alias reaches the same
  //   score as the unrelated Spanish town literally named "Andorra"), at
  //   which point population (below) breaks the tie in the capital's favor.
  //   A capital's own real name always wins outright either way.
  function matchScore(c) {
    let tier;
    if (c.name.toLowerCase() === cityQuery || c.ascii_name.toLowerCase() === cityQuery) tier = 2;
    else if (c.nameF === cityQuery || c.asciiF === cityQuery) tier = 2;
    else if (c.aliasesF.some(a => a === cityQuery)) tier = 1;
    else tier = 0; // prefix
    // Only capitals of UN-recognized sovereign states get the bonus —
    // territories (Bermuda, Cayman Islands, ...) don't outrank real cities
    // of the same name elsewhere (e.g. Hamilton, Canada vs Hamilton, Bermuda).
    return tier + (c.isCapital && UN_COUNTRIES.has(c.country) ? 1 : 0);
  }
  matches.sort((a,b) => matchScore(b) - matchScore(a) || b.pop - a.pop);

  if (hint) { return [matches[0]]; }
  if (S.countryMode==='any') { return [matches[0]]; }
  if (S.countryMode==='specific') {
    matches = matches.filter(c=>c.country===S.specificCountry);
    if (!matches.length) return [];
    return [matches[0]];
  }
  return matches; // every
}

// Night mode's city lights are drawn on this canvas instead of as SVG circles
// with a blur filter. SVG filters are expensive to re-rasterize on every pan/
// zoom frame; canvas sprite-blitting (pre-render the glow once, then just
// stamp + scale it per city every frame) is dramatically cheaper and is what
// actually fixes the drag/wheel-zoom lag. The SVG dots still exist underneath
// (hidden via CSS) purely so the existing highlight/pulse-ring animation and
// hover tooltip machinery can be reused rather than rebuilt twice.

// Pre-render the glow once as a small offscreen sprite (same stops as the old
// #cityLightGrad SVG gradient). Drawing this per city each frame is just a
// scaled image blit — no gradient math, no blur — so cost barely grows with
// the number of cities on screen.
//
// It's pre-rendered at several sizes (a small mip chain), not just one, and
// drawImage picks whichever is closest to the actual on-screen size (see
// pickGlowSprite) so the downscale itself stays mild.
//
// Every dot-size preset uses this same soft gradient, so Tiny is genuinely a
// smaller, dimmer point of light than Smaller — not "Smaller minus the halo".
// (Tiny used to get a separate "hard" gradient with a wide full-bright core;
// that made its brightest pixel as bright as Smaller's and only trimmed the
// outer glow, so the two looked nearly identical.)
function makeGlowSprite(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2, R = size / 2;
  const grad = c.createRadialGradient(cx, cy, 0, cx, cy, R);
  grad.addColorStop(0,    'rgba(255,246,217,1)');
  grad.addColorStop(0.18, 'rgba(255,207,107,0.95)');
  grad.addColorStop(0.45, 'rgba(255,138,60,0.5)');
  grad.addColorStop(1,    'rgba(255,106,26,0)');

  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();

function pickGlowSprite(targetDevicePx) {

function resizeNightCanvas() {
  const [W, H] = getMapSize();
  nightDPR = window.devicePixelRatio || 1;
  nightCanvas.width  = Math.max(1, Math.round(W * nightDPR));
  nightCanvas.height = Math.max(1, Math.round(H * nightDPR));
}

function drawNightCanvas() {
  if (!S.nightMode) return;
  const [W, H] = getMapSize();
  nctx.setTransform(nightDPR, 0, 0, nightDPR, 0, 0);
  nctx.clearRect(0, 0, W, H);
  if (quizMode) return; // Prefectures quiz: previously typed cities are hidden, so draw no lights
  const t = currentTransform;
  nctx.save();
  nctx.translate(t.x, t.y);
  nctx.scale(t.k, t.k);
  nctx.globalCompositeOperation = 'screen'; // matches the old mix-blend-mode:screen — overlapping lights brighten instead of stacking as flat discs
  nctx.globalAlpha = S.dotAlpha;
  for (const city of found) {
    if (nightHighlightId === dotId(city) || nightHoverId === dotId(city)) continue; // drawn separately, full-bright, by the SVG highlight/hover instead
    const p = projection([city.lon, city.lat]);
    if (!p) continue;
    const [cx, cy] = p;
    // Glow radius as a multiple of the dot radius. Tiny gets a slightly wider
    // multiple so that, at its very small dot radius, it stays a visible point
    // of light (~1/3 of Smaller's total light) instead of fading out entirely.
    const glowR = dotR(city.pop) * (S.dotSizeMode === 'tiny' ? 3.7 : 3.2);

    // zoom (t.k) and pixel ratio (nightDPR) already baked into the canvas
    // transform above — this is what pickGlowSprite needs to avoid an
    // over-aggressive downscale.
    const targetDevicePx = glowR * 2 * t.k * nightDPR;
    nctx.drawImage(pickGlowSprite(targetDevicePx), cx - glowR, cy - glowR, glowR * 2, glowR * 2);

  nctx.restore();

function cityScreenPos(city) {
  const p = projection([city.lon, city.lat]);
  if (!p) return null;
  const t = currentTransform;
  return [p[0] * t.k + t.x, p[1] * t.k + t.y, dotR(city.pop) * t.k];

  let best = null, bestDist = Infinity;
  for (const city of found) {
    const pos = cityScreenPos(city);
    if (!pos) continue;
    const [cx, cy, r] = pos;
    const hit = Math.max(r + 4, 7); // generous hit padding for small dots
    const d = Math.hypot(sx - cx, sy - cy);

  const onMove = ev => { const rc=mapEl.getBoundingClientRect(); tooltip.style.left=(ev.clientX-rc.left+14)+'px'; tooltip.style.top=(ev.clientY-rc.top-46)+'px'; };
  const onOut = () => tooltip.style.display='none';
  const onClick = () => { tooltip.style.display='none'; highlightCity(city); };

  dg.append('circle')
    .attr('class','main-dot')
    .attr('cx',cx).attr('cy',cy).attr('r', dotR(city.pop))
    .attr('data-pop', city.pop||0)
    .attr('fill', dotFill()).attr('fill-opacity', dotFillOpacity())
    .attr('stroke', dotStroke()).attr('stroke-width', dotStrokeWidth(city.pop))
    .attr('filter', dotFilter())
    .style('cursor','pointer')
    .on('mouseover', onOver).on('mousemove', onMove).on('mouseout', onOut).on('click', onClick);

  // Pin-mode markup — always built alongside the flat circle (hidden via CSS
  // unless body.pin-mode is set) so toggling the mode needs no rebuild.
  const pg = dg.append('g').attr('class','pin-group');
  pg.append('ellipse').attr('class','pin-shadow').attr('fill','rgba(0,0,0,.25)');
  pg.append('line').attr('class','pin-shaft').attr('stroke-linecap','round');
  pg.append('circle').attr('class','pin-ball')
    .on('mouseover', onOver).on('mousemove', onMove).on('mouseout', onOut).on('click', onClick);
  pg.append('ellipse').attr('class','pin-gloss').attr('fill','#fff').attr('opacity',0.55);
  applyPinGeom(pg, cx, cy, city.pop);
  // Each pin gets a random one of the 4 fixed colours the moment it's placed
  // (equal odds each). The choice is stored on the city itself so it stays
  // the same if the dot is later redrawn (region/resize change) or the
  // session is reloaded, rather than reshuffling.
  if (!city._pinColorKey) city._pinColorKey = randomPinColorKey();
  pg.attr('data-pin-color', city._pinColorKey);
  applyPinColorTo(pg);
}

function removeCity(city) {
  if (!confirm(`Remove "${city.name}" from the map?`)) return;
  svg.select('#'+dotId(city)).remove();
  found = found.filter(f=>!(f.name===city.name&&f.country===city.country&&(f.admin1||'')===(city.admin1||'')));
  const card = document.getElementById('card-'+dotId(city));
  if (card) card.remove();
  renumberFoundItems();
  renderBestCountries();
  renderOtherStats();
  updateSummary();
  drawNightCanvas();
  persistSession();
}

function renderFoundGrid() {
  const titleEl = document.getElementById('panelTitle');
  if (titleEl) titleEl.textContent = (quizMode && quizCfg()) ? quizCfg().Nouns : 'Cities';

  const grid = document.getElementById('foundGrid');
  grid.innerHTML = '';

  // Region quiz: the panel lists solved regions (name, capital,
  // population) instead of typed-and-found cities — see renderQuizFoundGrid.
  if (quizMode && quizCfg()) {
    renderQuizFoundGrid(grid);
    return;
  }

  if (!found.length) {
    renderEmptyFoundGrid(grid);
    return;
  }
  const list = sortByPop
    ? [...found].sort((a,b) => (b.pop||0) - (a.pop||0))
    : [...found].reverse();
  list.forEach((city, i) => {
    const id = dotId(city);
    const div = document.createElement('div');
    const isUSMode = currentRegion === 'usa';
    const isJPMode = currentRegion === 'japan';
    const _capState = US_STATE_CAPITALS.get(city.name.toLowerCase());
    const isStateCapital = isUSMode && _capState !== undefined && (city.admin1 || '').toUpperCase() === _capState;
    const isPrefCapital = isJPMode && isJPPrefCapital(city);
    const isCapitalItem = (city.isCapital && !isUSMode && !isJPMode && UN_COUNTRIES.has(city.country)) || isStateCapital || isPrefCapital;
    div.className='fi' + (isCapitalItem ? ' fi-is-capital' : '') + (id === _justAddedId ? ' fi-enter' : ''); div.id='card-'+id;
    div.style.cursor='pointer';
    div.title='Click to locate on map';
    const capitalStar = isCapitalItem
      ? `<span class="fi-capital" title="${isStateCapital ? 'State capital' : (isPrefCapital ? 'Prefecture capital' : 'Capital')}">★</span>` : '';
    const guessNum = found.indexOf(city) + 1;
    div.innerHTML=`<span class="fi-num">${guessNum}.</span><div class="fi-info"><span class="fi-name">${displayName(city)}${city.pop?` <span class="fi-pop">(${fmtPop(city.pop)})</span>`:''}${capitalStar}</span><span class="fi-meta">${fmtLocation(city)}</span></div><button class="rm" title="Remove">✕</button>`;
    div.querySelector('.rm').onclick = (e) => { e.stopPropagation(); removeCity(city); };
    div.onclick = () => highlightCity(city);
    grid.appendChild(div);
  });
  _justAddedId = null; // consumed — later re-renders (sort toggle, remove, etc.) shouldn't replay the animation

  // No city data is currently loaded (e.g. a saved session restored some
  // found cities, but the data file failed to auto-load this time round) —
  // surface the "Load data file" button on top of the list regardless, since
  // there'd otherwise be no way to get back into a guessable state.
  if (!cityDB.length) {
    const overlay = document.createElement('div');
    overlay.className = 'fi-empty-overlay';
    overlay.innerHTML = `<div class="empty-load-wrap"><button type="button" id="emptyLoadFileBtn" class="empty-load-btn">📄 Load data file</button><div id="fileStatus">No file loaded</div></div>`;
    grid.appendChild(overlay);
  }
}

// Placeholder rows shown while no cities have been entered yet — same size/shape
// and bluish background as a real "found" row, but with blank bars instead of
// text, so the panel doesn't look like an empty white gap.
// `isPrefMode` swaps in the region-quiz skin and a matching empty message
// (see renderQuizFoundGrid) — there's no data file to load in that mode, so
// the "Load data file" button never applies there.
function renderEmptyFoundGrid(grid, isPrefMode) {
  const ROWS = 14;
  for (let i = 0; i < ROWS; i++) {
    const div = document.createElement('div');
    div.className = 'fi-empty' + (isPrefMode ? ' fi-empty-pref' : '');
    div.innerHTML = `<span class="fi-empty-bar fi-empty-num"></span><div class="fi-empty-info"><span class="fi-empty-bar fi-empty-name"></span><span class="fi-empty-bar fi-empty-meta"></span></div><span class="fi-empty-bar fi-empty-rm"></span>`;
    grid.appendChild(div);
  }
  const overlay = document.createElement('div');
  overlay.className = 'fi-empty-overlay';
  overlay.innerHTML = isPrefMode
    ? `<div class="empty-load-wrap"><span class="empty-load-msg">Click a ${(quizCfg() || {}).noun || 'region'} to see it here!</span></div>`
    : (cityDB.length
      ? `<div class="empty-load-wrap"><span class="empty-load-msg">Type a city to see it here!</span></div>`
      : `<div class="empty-load-wrap"><button type="button" id="emptyLoadFileBtn" class="empty-load-btn">📄 Load data file</button><div id="fileStatus">No file loaded</div></div>`);
  grid.appendChild(overlay);
}

// Renders the quiz version of the side panel: one row per correctly-guessed
// region (most-recently-solved first, or by population when "Sort by
// population" is checked), showing the region's name plus its capital and
// population — in place of the typed-city rows the panel normally shows (see
// renderFoundGrid).
function renderQuizFoundGrid(grid) {
  const cfg = quizCfg();
  if (!cfg) return;
  const solvedIds = Array.from(quizSolved); // Set preserves solve order
  if (!solvedIds.length) {
    renderEmptyFoundGrid(grid, true);
    return;
  }
  const list = sortByPop
    ? [...solvedIds].sort((a, b) => (cfg.pop[b] || 0) - (cfg.pop[a] || 0))
    : [...solvedIds].reverse();
  list.forEach(id => {
    const div = document.createElement('div');
    const guessNum = solvedIds.indexOf(id) + 1;
    const name = cfg.names[id] || '?';
    const capital = cfg.capitals[id] || '—';
    const pop = cfg.pop[id]; // whole-region population, NOT the capital city's
    div.className = 'fi fi-pref';
    div.innerHTML = `<span class="fi-num">${guessNum}.</span><div class="fi-info"><span class="fi-name">${name}</span><span class="fi-meta">Capital: ${capital}</span>${pop ? `<span class="fi-meta fi-pref-pop">Population: ${fmtPop(pop)}</span>` : ''}</div>`;
    grid.appendChild(div);
  });
}

    let code, name;
    if (mode === 'usa') {
      if (city.country !== 'US') return; // skip non-US cities in US mode
      code = (city.admin1 || '').toUpperCase();
      if (!code) return;
      const full = US_STATES[code];
      name = full ? full.replace(/\b\w/g, c => c.toUpperCase()) : code;
    } else if (mode === 'japan') {
      if (city.country !== 'JP') return; // skip non-Japan cities in Japan mode
      code = normalizeJPAdmin1(city.admin1);
      if (code == null) return;
      name = JP_PREF_NAMES[code] || String(code);
    } else {
      code = city.country;
      name = fmtCountry(code);
    }
    if (!counts[code]) counts[code] = { name, count: 0 };
    counts[code].count++;
  });

  const sorted = Object.entries(counts)
    .map(([code, v]) => ({ code, name: v.name, count: v.count }))
    .sort((a,b) => b.count - a.count);

  listEl.innerHTML = '';
  const rest = sorted.slice(5);
  rest.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'best-row';
    row.innerHTML = `<span class="best-rank">${i+6}.</span><span class="best-name">${item.name} — ${item.count}</span>`;
    listEl.appendChild(row);
  });

  if (toggleBtn) {
    if (rest.length) {
      toggleBtn.style.display = '';
      toggleBtn.textContent = bestListExpanded ? 'Hide full list ▴' : `Show full list (${rest.length}) ▾`;
    } else {
      toggleBtn.style.display = 'none';
    }
  }
  listEl.style.display = (bestListExpanded && rest.length) ? '' : 'none';

  renderTopShapes(sorted.slice(0, 5), mode);
}

// Draws the top-5 best countries/states/prefectures as little map-shape
// "silhouette" cards in the space between the settings and found-cities columns.
const shapeGeoCache = { countries: null, usStates: null, japanPrefs: null };

async function getSilhouetteFeatures(mode) {
  if (mode === 'usa') {
    if (!shapeGeoCache.usStates) {
      const data = await getGeoData('us-states');
      shapeGeoCache.usStates = topojson.feature(data, data.objects.states).features;
    }
    return shapeGeoCache.usStates;
  }
  if (mode === 'japan') {
    if (!shapeGeoCache.japanPrefs) {
      const data = await getGeoData('japan-prefs');
      shapeGeoCache.japanPrefs = topojson.feature(data, data.objects.japan).features;
    }
    return shapeGeoCache.japanPrefs;
  }
  if (!shapeGeoCache.countries) {
    const data = await getGeoData('50m');
    shapeGeoCache.countries = topojson.feature(data, data.objects.countries).features;
    shapeGeoCache.countries.forEach(fixInvertedWinding);
  }
  return shapeGeoCache.countries;
}

function findCountryShape(features, iso2) {
  const num = ISO_NUMERIC[iso2];
  if (num == null) return null;
  return features.find(f => Number(f.id) === num) || null;
}

function findStateShape(features, abbr) {
  const fullName = US_STATES[abbr];
  if (!fullName) return null;
  return features.find(f => ((f.properties && f.properties.name) || '').toLowerCase() === fullName.toLowerCase()) || null;
}

function findPrefShape(features, prefId) {
  return features.find(f => f.properties && Number(f.properties.id) === Number(prefId)) || null;
}

const SHAPE_MODE_LABELS = { usa: 'states', japan: 'prefectures', country: 'countries' };

let shapeRenderToken = 0;
async function renderTopShapes(top5, mode) {
  const wrap = document.getElementById('topShapesList');
  const titleEl = document.getElementById('bestVisualTitle');
  if (!wrap) return;
  const modeLabel = SHAPE_MODE_LABELS[mode] || SHAPE_MODE_LABELS.country;
  if (titleEl) titleEl.textContent = 'Top ' + modeLabel.replace(/\b\w/g, c => c.toUpperCase());

  const token = ++shapeRenderToken;
  if (!top5.length) {
    wrap.innerHTML = `<div class="shape-empty">Guess some cities to see your top ${modeLabel} here</div>`;
    return;
  }

  let features = [];
  try { features = await getSilhouetteFeatures(mode); } catch (e) { features = []; }
  if (token !== shapeRenderToken) return; // a newer render started while we were loading

  wrap.innerHTML = '';
  const SZ = 112;
  top5.forEach((item, i) => {
    const feature = mode === 'usa' ? findStateShape(features, item.code)
      : mode === 'japan' ? findPrefShape(features, item.code)
      : findCountryShape(features, item.code);
    let iconHtml = '<div class="shape-fallback">🌐</div>';
    if (feature) {
      const proj = d3.geoMercator().fitSize([SZ - 8, SZ - 8], feature);
      const d = d3.geoPath().projection(proj)(feature);
      if (d) {
        iconHtml = `<svg viewBox="0 0 ${SZ} ${SZ}" width="${SZ}" height="${SZ}"><path d="${d}" transform="translate(4,4)" fill="var(--accent2)" fill-opacity="0.82" stroke="var(--accent2)" stroke-width="0.6"/></svg>`;
      }
    }
    const card = document.createElement('div');
    card.className = 'shape-card';
    card.innerHTML = `
      <span class="shape-rank">${i + 1}</span>
      <div class="shape-icon">${iconHtml}</div>
      <div class="shape-name">${item.name}</div>
      <div class="shape-count">${item.count} ${item.count === 1 ? 'city' : 'cities'}</div>
    `;
    wrap.appendChild(card);
  });
}
