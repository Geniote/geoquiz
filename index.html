<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>World City Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;--surface:#fff;--border:#d8d8d0;--text:#1a1a1a;--text2:#666;--text3:#999;
  --accent:#d85a30;--accent2:#2B4C7E;--success:#2e7d32;--danger:#c62828;--warn:#e65100;
  --sw:260px;--pw:270px;
  --glass:rgba(255,255,255,.28);--glass-border:rgba(255,255,255,.45);
}
/* Night mode — dark UI chrome to match the darkened map (see Dot Appearance section) */
body.night-mode{
  --bg:#11151c;--surface:#1a1f29;--border:#2a3140;--text:#e7ecf5;--text2:#9aa5b8;--text3:#6b7686;
  --accent:#ff8a5c;--accent2:#6fa0e0;--success:#66bb6a;--danger:#ef5350;--warn:#ffa726;
  --glass:rgba(22,28,39,.28);--glass-border:rgba(255,255,255,.1);
}
body.night-mode .zbtn,
body.night-mode #zoomLbl,
body.night-mode #panelToggleBtn{background:rgba(20,24,32,.85);color:#fff}
body.night-mode #cityInput:focus{background:#1a1f29}
body.night-mode #cityInputWrap:focus-within{background:#1a1f29;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
/* The Region dropdown's own open/closed control picks up the dark theme
   fine; this styles its popup option list (rendered by the browser, but
   still respects colour/background set on the <option>s themselves) to
   match — dark background, white text — instead of the browser's plain
   white popup default. */
body.night-mode select option{color:#fff;background:#1a1f29}
body.night-mode select optgroup{color:#fff;background:#1a1f29}
body.night-mode .fi,
body.night-mode .fi-empty{background:#182233}
body.night-mode .fi.fi-is-capital{background:#1f3350}
body.night-mode .fi.fi-pref{background:#4a3f1a}
body.night-mode .fi.fi-pref::before{background:#e0bf5a}
body.night-mode .fi.highlighted{background:#3a3418}
body.night-mode .city-dot circle.main-dot{mix-blend-mode:screen}
body.night-mode.map-panning .city-dot circle.main-dot{filter:none !important;mix-blend-mode:normal !important}
/* All city lights in Night mode are drawn on #nightCanvas instead (see NIGHT
   CANVAS in the script) — the SVG dots are hidden, except the one instance
   being actively highlighted after a correct guess, whose brief pulse-ring
   animation still reuses the existing SVG machinery since it's just one
   element at a time and not a per-frame cost. */
body.night-mode .city-dot{display:none}
body.night-mode .city-dot.force-visible{display:block}
/* Hover "pop": the circle scales up with a little overshoot on mouseover, so
   the dot the user is pointing at visibly stands out from its neighbours.
   transform-box:fill-box makes the scale originate from the circle's own
   centre rather than the SVG viewport's, so it grows in place. Day mode gets
   this for free via :hover; Night mode's dots are display:none (see above)
   so JS toggles the same .hover-active class manually when it detects a
   hover via manual hit-testing (see onNightMouseMove). */
.city-dot circle.main-dot{transition:transform .18s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
.city-dot circle.main-dot:hover,
.city-dot circle.main-dot.hover-active{transform:scale(1.7)}
/* Pin mode — every dot also carries a hidden "3D pin" group (ball + shaft +
   gloss highlight) alongside its normal flat circle; only one of the two is
   shown at a time via body.pin-mode, so switching the mode needs no rebuild. */
.city-dot .pin-group{display:none}
body.pin-mode .city-dot .pin-group{display:block}
body.pin-mode .city-dot circle.main-dot{display:none}
.pin-group .pin-shadow,.pin-group .pin-shaft,.pin-group .pin-gloss{pointer-events:none}
.pin-group .pin-ball{cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
.pin-group .pin-ball:hover,
.pin-group .pin-ball.hover-active{transform:scale(1.25)}
body.night-mode .fi-empty-bar{background:rgba(255,255,255,.09)}
body.night-mode .fi-empty-overlay{background:rgba(0,0,0,.4)}
body.night-mode .fi-empty-overlay .empty-load-btn{background:#1a1f29;color:var(--text);border-color:rgba(255,255,255,.14)}
body.night-mode .fi-empty-overlay .empty-load-msg{background:#1a1f29;color:var(--text);border-color:rgba(255,255,255,.14)}
body.night-mode .sess-card.current{background:#182233}
body.night-mode .rm:hover{background:#3a1f1f}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
#appRow{display:flex;flex-direction:row;flex:1;min-height:0}
#leftCol{display:flex;flex-direction:column;flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden}
#content{display:flex;flex:1;flex-direction:column;min-height:0}

/* TOP BAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
#topbar h1{font-size:14px;font-weight:700;color:var(--accent2);white-space:nowrap;flex-shrink:0}
#topbar-right{display:flex;align-items:center;gap:8px}
.tbbtn{height:30px;padding:0 12px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:var(--surface);color:var(--text);white-space:nowrap;flex-shrink:0}
.tbbtn:hover{background:var(--bg)}
.tbbtn.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.tbbtn.primary:hover{background:#1e3a66}
.tbbtn.danger{background:#c96a63;color:#fff;border-color:#c96a63}
.tbbtn.danger:hover{filter:brightness(0.92)}
body.night-mode .tbbtn.danger{background:#a85850;border-color:#a85850}
.ok{color:var(--success)}.err{color:var(--danger)}.dup{color:var(--warn)}.info{color:var(--text2)}

/* STATUS STRIP — thin bar below the session/input bar showing the found-cities
   summary; floats over the map (glass effect). */
#statusRow{display:flex;align-items:center;justify-content:center;padding:2px 12px;background:var(--glass);backdrop-filter:blur(6px) saturate(1.3);-webkit-backdrop-filter:blur(6px) saturate(1.3);border-bottom:1px solid var(--glass-border);flex-shrink:0;position:relative;z-index:10}
#inputControls{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}
#cityInputWrap{position:relative;width:480px;max-width:100%;height:38px;border:2px solid var(--border);border-radius:9px;background:var(--bg);transition:border-color .15s,background .15s}
#cityInputWrap:focus-within{border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px rgba(43,76,126,.1)}
#cityInput{width:100%;height:100%;padding:0 128px 0 16px;font-size:16px;font-weight:500;border:none;outline:none;background:transparent;color:var(--text);letter-spacing:.01em;border-radius:9px}
#cityInput::placeholder{color:var(--text3);font-weight:400}
/* Country filter: custom dropdown (a native <select> renders a full-height
   OS list — this keeps the drop-down compact and scrollable instead). */
#countryFilterBtn{position:absolute;right:3px;top:3px;bottom:3px;width:120px;display:flex;align-items:center;gap:4px;margin:0;border:none;border-left:1px solid var(--border);border-radius:0 7px 7px 0;background-color:transparent;font-size:11px;font-weight:600;color:var(--text2);padding:0 8px;cursor:pointer;text-align:left}
#countryFilterBtn:hover{color:var(--text);background-color:rgba(0,0,0,.03)}
#countryFilterBtn.filtering{color:var(--accent2)}
#cfBtnLabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cfCaret{flex-shrink:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid currentColor}
#countryFilterPanel{display:none;position:absolute;right:0;top:calc(100% + 5px);width:190px;max-height:216px;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.18);z-index:60;padding:4px}
#countryFilterPanel.open{display:block}
.cf-opt{display:block;width:100%;padding:5px 8px;border:none;border-radius:5px;background:none;font-size:11.5px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cf-opt:hover{background:var(--bg)}
.cf-opt.active{background:#f0f4fb;color:var(--accent2)}
body.night-mode .cf-opt.active{background:rgba(43,76,126,.3)}
.cf-sep{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px 3px;border-top:1px solid var(--border);margin-top:4px}
.cf-empty{padding:7px 8px;font-size:11px;color:var(--text3)}

/* MAP PICKER — button in the session bar (left of the typing bar) + its modal */
#mapPickBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;font-size:14px;font-weight:600;border:2px solid var(--border);border-radius:9px;cursor:pointer;background:var(--surface);color:var(--text2);white-space:nowrap;flex-shrink:0}
#mapPickBtn:hover{background:var(--bg);color:var(--text)}
/* The map button sits in a slot that is layout-transparent by default (mobile,
   and the Prefectures quiz where the typing bar is hidden). On desktop with the
   typing bar showing, see the "even spacing" rules in the floating-list block. */
#mapPickSlot{display:contents}
#mapPickDot{width:11px;height:11px;border-radius:50%;background:#2B4C7E;flex-shrink:0}
#mapModal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#mapModal.open{display:flex}
#mapBox{background:var(--surface);border-radius:12px;width:520px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.22);overflow:hidden}
#mapBoxHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
#mapBoxHead h2{font-size:15px;font-weight:700;color:var(--accent2)}
#mapClose{border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--text2);line-height:1;padding:2px 6px;border-radius:4px}
#mapClose:hover{background:var(--bg)}
/* Hide the city-typing bar (input, country filter, Find/Clear all) while the
   Japan prefecture quiz is active — none of it is used there, since progress
   comes from clicking prefectures, not typing city names. */
body.quiz-typing-hidden #inputControls{display:none}
/* JAPAN MODE MODAL — same look as the map-selection modal, but stacks on top
   of it (higher z-index) and shows two big choices instead of a grid. */
#modePickModal{display:none;position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#modePickModal.open{display:flex}
#modePickBox{background:var(--surface);border-radius:12px;width:380px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.22);overflow:hidden}
#modePickHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
#modePickHead h2{font-size:15px;font-weight:700;color:var(--accent2)}
#modePickClose{border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--text2);line-height:1;padding:2px 6px;border-radius:4px}
#modePickClose:hover{background:var(--bg)}
#modePickList{display:flex;flex-direction:column;gap:10px;padding:14px 18px 18px}
.modepick-opt{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.modepick-opt:hover{border-color:var(--accent2);box-shadow:0 2px 8px rgba(43,76,126,.1)}
.modepick-opt.current{border-color:var(--accent2);background:#f0f4fb}
body.night-mode .modepick-opt.current{background:rgba(43,76,126,.25)}
.modepick-row{display:flex;align-items:center;justify-content:space-between;width:100%}
.modepick-check{color:var(--accent2);font-size:13px;font-weight:700}
.modepick-title{font-size:13.5px;font-weight:700;color:var(--text)}
.modepick-desc{font-size:11.5px;color:var(--text2);line-height:1.4}
#mapList{flex:1;overflow-y:auto;padding:12px 14px}
.map-group-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 8px}
.map-group+.map-group{margin-top:14px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.map-opt{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--text);text-align:left;transition:border-color .15s,box-shadow .15s}
.map-opt:hover{border-color:var(--accent2);box-shadow:0 2px 8px rgba(43,76,126,.1)}
.map-opt.current{border-color:var(--accent2);background:#f0f4fb}
body.night-mode .map-opt.current{background:rgba(43,76,126,.25)}
.map-opt-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.map-opt-flag{width:16px;flex-shrink:0;font-size:14px;line-height:1;text-align:center}
.map-opt-check{margin-left:auto;color:var(--accent2);font-size:12px}
/* Notification / transient guess feedback — floats over the top-left corner
   of the map instead of taking up space in the status strip. */
.overlayMsg{font-size:11px;font-family:'Nunito','Varela Round','Trebuchet MS',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s;text-align:left;line-height:1.3;letter-spacing:.01em;font-weight:500}
#msg{position:absolute;top:80px;left:10px;z-index:6;max-width:70%;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:6px;padding:4px 10px;pointer-events:none}
body.night-mode #msg{background:rgba(20,24,32,.85)}
#summaryBar{font-size:17px;font-weight:500;color:var(--text2);text-align:center;display:block;padding:1px 12px 0;align-self:center}
#summaryBar strong{color:var(--text);font-weight:700;font-size:19px}
#summaryBar .pop-total{color:var(--accent2);font-weight:700}
#main{display:flex;flex-direction:column;height:100vh;min-height:100vh;flex-shrink:0;position:relative}
#mapWrap{position:absolute;inset:0;overflow:hidden;cursor:grab;z-index:1;touch-action:none}
#bottomPanels{display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;width:100%;border-top:2px solid #2b4c7e;position:relative}
#mapWrap:active{cursor:grabbing}
svg#map{width:100%;height:100%}
#map-g,#physical-g{will-change:transform;transform-box:view-box;transform-origin:0 0}
#nightCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
body.night-mode #nightCanvas{display:block;mix-blend-mode:screen}
.zbtn-wrap{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
.zbtn{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.9);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zbtn:hover{background:var(--surface)}
#resetViewBtn{font-size:14px;padding:0;color:var(--text2)}
#resetViewBtn svg{width:14px;height:14px;display:block;pointer-events:none}
#zoomLbl{font-size:11px;color:var(--text2);background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:5px;padding:2px 7px;text-align:center;white-space:nowrap}
#mapColorsBtn,#dotAppearanceBtn{position:absolute;left:10px;font-size:12px;line-height:1.25;color:var(--text2);background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;z-index:6;display:flex;align-items:center;gap:5px}
/* Bottom-aligned with the zoom controls on the right (12px), stacked upward */
#mapColorsBtn{bottom:12px}
#dotAppearanceBtn{bottom:50px}
#mapColorsBtn:hover,#dotAppearanceBtn:hover{background:var(--surface)}
#mapColorsBtn.active,#dotAppearanceBtn.active{border-color:var(--accent2);color:var(--accent2)}
body.night-mode #mapColorsBtn,body.night-mode #dotAppearanceBtn{background:rgba(20,24,32,.85)}
/* Region-quiz progress chip, lives in the session bar (not on the map) —
   hidden unless a quiz (Japan — Prefectures / United States — States) is the
   active mode (see setQuizMode). */
#quizIndicator{display:none;align-items:center;gap:4px;height:26px;padding:0 8px 0 10px;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text2);white-space:nowrap;flex-shrink:0}
#quizIndicator.on{display:flex}
#quizIndicatorReset{display:flex;align-items:center;justify-content:center;width:17px;height:17px;font-size:11px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:none;color:var(--text2)}
#quizIndicatorReset:hover{border-color:var(--accent2);color:var(--accent2)}
/* On devices with a real mouse, keep these buttons icon-only until hovered,
   then reveal the label text. Touch devices (no hover) keep the label
   always visible since there's no hover state to expand it. */
@media (hover:hover) and (pointer:fine){
  #mapColorsBtn,#dotAppearanceBtn{gap:0}
  #mapColorsBtn .btn-label,#dotAppearanceBtn .btn-label{display:inline-block;max-width:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
  #mapColorsBtn:hover .btn-label,#mapColorsBtn:focus-visible .btn-label,#mapColorsBtn.active .btn-label,
  #dotAppearanceBtn:hover .btn-label,#dotAppearanceBtn:focus-visible .btn-label,#dotAppearanceBtn.active .btn-label{max-width:150px;margin-left:5px;opacity:1}
}
/* Mobile-only control to hide/show the below-map cities panel so the map can
   take up most of the screen. Hidden on desktop (the panel always shows
   there); only revealed and positioned inside the mobile media query below.
   (Not placed near the top of the map — that area sits underneath the
   session/status bars, which render above the map and would hide it.) */
#panelToggleBtn{display:none;position:absolute;font-size:12px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer;z-index:6}
#mapColorsPopover,#dotAppearancePopover{position:absolute;bottom:88px;left:10px;z-index:7;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none}
#mapColorsPopover{width:190px}
#dotAppearancePopover{width:250px}
#mapColorsPopover.open,#dotAppearancePopover.open{display:block}
#mapColorsPopover .pop-title,#dotAppearancePopover .pop-title{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em}
#mapColorsPopover .pop-title-row,#dotAppearancePopover .pop-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
/* Icon-only toggles for Night / Physical mode: the checkbox stays in the DOM
   (JS still reads and sets .checked) but is visually hidden — the emoji is the
   whole control, and it lights up in the accent colour when selected. */
.row.mode-toggles{justify-content:flex-start;gap:4px}
.mode-toggles{display:flex;align-items:center}
.mode-toggle{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--bg);cursor:pointer;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,filter .15s ease,opacity .15s ease}
.mode-toggle input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.mode-toggle .mode-ico{font-size:17px;line-height:1;filter:grayscale(1);opacity:.55;transition:filter .15s ease,opacity .15s ease}
.mode-toggle:hover{border-color:var(--accent2)}
.mode-toggle:hover .mode-ico{opacity:.85}
.mode-toggle:focus-within{box-shadow:0 0 0 3px rgba(43,76,126,.18)}
.mode-toggle:has(input:checked){background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 0 2px rgba(43,76,126,.18)}
.mode-toggle:has(input:checked) .mode-ico{filter:none;opacity:1}
body.night-mode .mode-toggle:focus-within{box-shadow:0 0 0 3px rgba(111,160,224,.22)}
body.night-mode .mode-toggle:has(input:checked){box-shadow:0 0 0 2px rgba(111,160,224,.22)}
.tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;pointer-events:none;display:none;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.12);line-height:1.6;white-space:nowrap}
/* Prefecture-quiz prompt label that follows the cursor at all times while the
   quiz is active — a separate element from .tooltip (which the mobile media
   query force-hides, since hover has no touch equivalent; this one should
   still work on touch devices once positioned by a tap). It always shows the
   prefecture the user is being asked to find, and briefly swaps to a
   correct/wrong variant to give feedback on a click before reverting. */
.quiz-tooltip{position:absolute;background:var(--accent2);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;pointer-events:none;display:none;z-index:32;box-shadow:0 3px 10px rgba(0,0,0,.25);white-space:nowrap;letter-spacing:.01em;transition:background-color .15s ease}
.quiz-tooltip.correct{background:#2fa84f}
.quiz-tooltip.wrong{background:#d64550}
.quiz-tooltip.complete{background:#2fa84f}
/* Active only while a region quiz (Japan prefectures / US states) is toggled on
   (class added to #mapWrap by setQuizMode). */
.quiz-active #countries-g path{cursor:pointer;transition:fill .12s ease}
/* Shapes that are drawn but aren't part of the quiz (DC / territories on the US map). */
.quiz-active #countries-g path.quiz-inert{cursor:default}
/* Hover "pop" for the prefecture quiz: brightens the fill of whichever
   prefecture the mouse is over. The actual highlighted BORDER is a separate
   overlay path (#quizHoverOutline, positioned/shown from JS on
   mouseenter/mouseleave — see quizWireHoverOutline) rather than this path's
   own stroke, because the internal prefecture-border mesh (#pref-borders) is
   drawn as its own layer on top of every prefecture path and would otherwise
   hide a plain :hover stroke change here. */
.quiz-active #countries-g path:not(.quiz-inert):hover{fill:var(--accent2);fill-opacity:.3}
/* Same brighten effect when the pointer is over a small region's enlarged
   (invisible) click margin rather than the shape itself. */
.quiz-active #countries-g path.quiz-hovered:not(.quiz-inert){fill:var(--accent2);fill-opacity:.3}
/* Invisible enlarged click targets for tiny islands — only live during a quiz. */
#quiz-hit-g path{pointer-events:none}
.quiz-active #quiz-hit-g path{pointer-events:stroke;cursor:pointer}
.quiz-hint-blink{animation:quizHintBlink .9s ease-in-out infinite}
@keyframes quizHintBlink{50%{fill:#facc15;fill-opacity:1}}
.quiz-solved{fill:var(--accent2);fill-opacity:.55!important;transition:fill .25s ease}
/* Solved-with-mistakes tiers: one wrong guess before getting it right on this
   round shows yellow, two-or-more shows red — otherwise (errorless) it stays
   the default blue above. Compound selectors give these higher specificity
   than the plain .quiz-solved rule so they reliably win regardless of
   declaration order, since both use !important. */
.quiz-solved.quiz-solved-yellow{fill:#e0b400!important}
.quiz-solved.quiz-solved-red{fill:var(--danger)!important}
.quiz-wrong-flash{fill:#d64550!important;fill-opacity:.65!important;transition:fill .15s ease}
#quizHoverOutline{fill:none;stroke:var(--accent2);stroke-width:1;stroke-opacity:0;pointer-events:none;filter:drop-shadow(0 0 3px var(--accent2));transition:stroke-opacity .12s ease}
#quizHoverOutline.show{stroke-opacity:1}

/* BELOW-MAP PANEL */
#panel{width:var(--pw);height:100%;border-left:2px solid #2b4c7e;background:var(--surface);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:relative}

/* DESKTOP: FLOATING, COLLAPSIBLE CITY LIST — the list is an overlay pinned to
   the right edge, on top of the map. The map itself never changes size, never
   redraws and never re-centres when the list opens or closes: it always fills
   the full width and simply has the list laid over its right-hand side.
   What DOES make room for the list (all sliding in sync with it, via --list-w):
     • the two bars at the top (session/typing bar + found-cities summary),
       which shrink so they end at the list's left edge,
     • the map's on-screen controls (zoom buttons + the collapse tab), which
       would otherwise be hidden underneath the list,
     • the stats block below the map.
   --sbw is the width of #leftCol's scrollbar (measured in JS), so the list
   sits beside that scrollbar rather than covering it.
   (On narrow screens the list is stacked under the map and has its own
   Hide/Show button, so none of this applies there.) */
#listCollapseBtn{display:none}
@media (min-width:861px){
  body{--list-w:var(--pw);--list-t:.38s cubic-bezier(.4,0,.2,1)}
  body.list-collapsed{--list-w:0px}
  #appRow{position:relative;overflow:hidden}
  #panel{
    position:absolute;top:0;bottom:0;height:auto;z-index:5;
    right:calc(var(--sbw,0px) + var(--list-w) - var(--pw));
    transition:right var(--list-t),visibility 0s;
  }
  body.list-collapsed #panel{visibility:hidden;transition:right var(--list-t),visibility 0s .38s}
  #sessionBar,#statusRow{margin-right:var(--list-w);transition:margin-right var(--list-t)}
  #bottomPanels{width:auto;margin-right:var(--list-w);transition:margin-right var(--list-t)}
  /* Even spacing in the session bar: the free space left over when the bar is
     wide is split equally between a slot around the map button and a slot
     around the Sessions button, while the typing bar keeps its natural width
     in the middle. The map button is centred in its slot, so it sits exactly
     as far from the session name as it does from the typing bar. */
  body:not(.quiz-typing-hidden) #mapPickSlot{display:flex;flex:1 0 auto;justify-content:center}
  body:not(.quiz-typing-hidden) #sessRightSlot{flex:1 0 auto;justify-content:flex-end}
  body:not(.quiz-typing-hidden) #inputControls{flex:0 1 auto}
  .zbtn-wrap{right:calc(12px + var(--list-w));transition:right var(--list-t)}
  #listCollapseBtn{display:flex;align-items:center;justify-content:center;position:absolute;right:var(--list-w);top:50%;transform:translateY(-50%);width:20px;height:56px;padding:0;border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;background:rgba(255,255,255,.9);color:var(--text2);cursor:pointer;z-index:6;box-shadow:-2px 0 8px rgba(0,0,0,.08);transition:background .15s,color .15s,width .15s,right var(--list-t)}
  #listCollapseBtn:hover{background:var(--surface);color:var(--accent2);width:24px}
  #listCollapseBtn:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
  #listCollapseBtn svg{width:9px;height:14px;display:block;pointer-events:none;transition:transform .38s cubic-bezier(.4,0,.2,1)}
  body.list-collapsed #listCollapseBtn svg{transform:rotate(180deg)}
  body.night-mode #listCollapseBtn{background:rgba(20,24,32,.85);color:#fff}
  body.night-mode #listCollapseBtn:hover{background:#1a1f29;color:var(--accent2)}
}
@media (prefers-reduced-motion:reduce){
  #panel,body.list-collapsed #panel,#sessionBar,#statusRow,#bottomPanels,.zbtn-wrap,#listCollapseBtn,#listCollapseBtn svg{transition-duration:0s !important;transition-delay:0s !important}
}

/* ══════════════════════════════════════════════════════════════════════════
   PHONE LAYOUT — everything below only applies on narrow / touch screens.
   Desktop layout (fixed 100vh, side-by-side map + sidebar) is untouched.
   Strategy: turn the rigid "sidebar app" layout into one scrollable column
   — map+controls first, then the found-cities/settings panel, then the
   country-stats panel — and enlarge every tappable control.
   ══════════════════════════════════════════════════════════════════════════ */
@media (max-width: 860px){
  html,body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto}
  #appRow{flex-direction:column;height:auto;min-height:100dvh;overflow:visible}
  /* display:contents unwraps leftCol so #main, #panel and #bottomPanels become
     siblings we can freely reorder with `order`, instead of #panel being
     stuck after the whole leftCol block. */
  #leftCol{display:contents}
  #main{order:1;height:64dvh;min-height:340px;max-height:640px;flex-shrink:0;width:100%;transition:height .2s ease}
  #panel{order:2;width:100%;height:auto;max-height:none;flex-shrink:0;border-left:none;border-top:2px solid #2b4c7e}
  #bottomPanels{order:3;width:100%}

  /* City-list toggle: show the floating button over the map (stacked above
     the zoom controls, clear of the session/status bars), and when
     collapsed, hide the panel + top-countries panel entirely and let the
     map grow to fill almost the whole screen. */
  #panelToggleBtn{display:block;bottom:calc(108px + env(safe-area-inset-bottom));right:calc(10px + env(safe-area-inset-right));font-size:12px;padding:7px 12px}
  body.panel-collapsed #main{height:88dvh;max-height:none;min-height:420px}
  body.panel-collapsed #panel{display:none}
  body.panel-collapsed #bottomPanels{display:none}

  /* Session bar: wrap onto its own rows instead of overflowing sideways */
  #sessionBar{flex-wrap:wrap;row-gap:8px;padding:8px 10px}
  #sessionName{max-width:46vw}
  #sessManagerBtn{margin-left:auto;order:3}
  #inputControls{order:4;flex-basis:100%;width:100%;flex-wrap:wrap;row-gap:8px}
  #cityInputWrap{flex:1 1 100%;width:100%;height:44px}
  #cityInput{font-size:16px;padding-right:126px}
  #countryFilterBtn{width:118px;font-size:11px}
  #countryFilterPanel{width:200px;max-height:240px}
  #mapPickBtn{height:44px;order:2}
  #quizIndicator{height:30px;order:2}
  #mapBox{width:94vw;max-height:88dvh}
  .map-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  #guessBtn{flex:1 1 0;height:42px;font-size:14px}
  #clearBtn{flex:1 1 0;height:42px;font-size:14px}

  #statusRow{padding:4px 10px}
  #summaryBar{font-size:14px}
  #summaryBar strong{font-size:16px}

  /* Map area: bigger touch targets for zoom/reset/settings controls,
     nudged clear of any notch/home-indicator safe areas */
  .zbtn-wrap{bottom:calc(12px + env(safe-area-inset-bottom));right:calc(10px + env(safe-area-inset-right));gap:6px}
  .zbtn{width:42px;height:42px;font-size:20px}
  #resetViewBtn svg{width:20px;height:20px}
  #zoomLbl{font-size:12px;padding:4px 8px}
  #mapColorsBtn,#dotAppearanceBtn{left:calc(10px + env(safe-area-inset-left));font-size:13px;padding:8px 13px}
  #mapColorsBtn{bottom:calc(12px + env(safe-area-inset-bottom))}
  #dotAppearanceBtn{bottom:calc(60px + env(safe-area-inset-bottom))}
  #mapColorsPopover,#dotAppearancePopover{bottom:calc(108px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left))}
  #mapColorsPopover{width:min(220px,80vw)}
  #dotAppearancePopover{width:min(250px,85vw)}
  .tooltip{display:none !important} /* hover tooltips have no touch equivalent; avoid a stuck ghost tooltip */

  /* Found-cities panel keeps its own internal scroll so the settings below
     it stay reachable without an endless list pushing the page down */
  #foundGrid{max-height:46vh}
  #panelHeader{padding:10px 12px}
  #missedBtn{padding:12px;font-size:14px}

  /* Country-filter / dot-appearance settings: bigger rows & controls */
  .lbl{font-size:13px}
  select{height:34px;font-size:13px}

  input[type=checkbox]{width:18px;height:18px}
  input[type=color]{width:38px;height:32px}
  .scale-preset-btn{padding:8px 0;font-size:12px}
  .mode-toggle{width:42px;height:42px}
  .mode-toggle .mode-ico{font-size:20px}

  /* Top-shapes / country cards: wrap to a small grid instead of squeezing */
  #topShapesList{flex-wrap:wrap}
  .shape-card{flex:1 1 27%;max-width:150px}
  .shape-icon{max-width:88px}
  .shape-fallback{font-size:48px}

  /* General: comfortable tap targets everywhere else */
  .tbbtn{height:38px;font-size:13px}
  .sca{height:32px;font-size:12px;padding:0 12px}
  #createSessBtn,#newSessNameInput{height:38px}
  .rm{width:26px;height:26px;font-size:14px}
  button,select,input{touch-action:manipulation}

  /* Modals: use available height fully on small screens */
  #sessBox,#missedBox{width:94vw;max-height:88dvh}
}

@media (max-width: 420px){
  #sessionName{max-width:38vw;font-size:13px}
  .sess-badge{display:none} /* reclaim space on very small phones */
  .shape-card{flex:1 1 40%}
}

<body>

<div id="appRow">
<div id="leftCol">
<div id="main">
  <!-- SESSION BAR (also houses the city input, now merged into one compact row) -->

    <!-- The region <select> is kept (hidden) as the single source of truth for

          <button type="button" class="cf-opt" data-val="every">Every country</button>

        </div>

  <!-- STATUS STRIP — thin bar showing the found-cities summary -->
  <div id="statusRow">

  </div>

  <div id="mapWrap">
    <div id="msg" class="overlayMsg"></div>
    <svg id="map" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Soft glow used for city dots in Night mode, so they read like lights seen from space.
             The filter region is sized just generously enough to hold the blur spread — a much
             larger region (the previous 700%) forces the browser to rasterize a far bigger canvas
             per dot than the blur actually needs, which is wasted work on every single frame. -->
        <filter id="cityGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur1"/>
            <feMergeNode in="blur2"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Night mode dot fill: warm core fading smoothly to transparent, so
             dots read as soft points of light (not solid discs with a visible
             edge) and blend together the way real city lights do when seen
             from orbit. -->
        <radialGradient id="cityLightGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6d9" stop-opacity="1"/>
          <stop offset="35%" stop-color="#ffcf6b" stop-opacity="0.95"/>
          <stop offset="70%" stop-color="#ff8a3c" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
    <!-- Night mode draws city lights here instead of as SVG circles+filters.
         Canvas sprite-blitting is dramatically cheaper to repaint than
         per-element SVG blur filters, which is what caused the drag/zoom lag.
         pointer-events stays off so drag-to-pan on the SVG underneath is
         unaffected; hover/click hit-testing for these dots is done manually
         in JS (see NIGHT CANVAS section). -->
    <canvas id="nightCanvas"></canvas>

      <button class="zbtn" id="zoomIn">+</button>
      <button class="zbtn" id="zoomOut">−</button>
      <button class="zbtn" id="resetViewBtn" title="Reset view"><svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M16.5 10a6.5 6.5 0 1 1-2.1-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.8 3.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button type="button" id="dotAppearanceBtn" title="Dot appearance"><svg width="15" height="15" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><defs><clipPath id="ballClipBtn"><circle cx="10" cy="10" r="9"/></clipPath><radialGradient id="ballGlossBtn" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity="0.6"/><stop offset="45%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#000" stop-opacity="0.2"/></radialGradient></defs><g clip-path="url(#ballClipBtn)"><rect x="0" y="0" width="20" height="20" fill="#f4c531"/><path d="M10 10 L20 10 A10 10 0 0 1 10 20 Z" fill="#3fb84f"/><path d="M10 10 L10 20 A10 10 0 0 1 0 10 Z" fill="#3b82f6"/><path d="M10 10 L0 10 A10 10 0 0 1 10 0 Z" fill="#e63946"/></g><circle cx="10" cy="10" r="9" fill="url(#ballGlossBtn)"/></svg> <span class="btn-label">Dot appearance</span></button>
    <button type="button" id="mapColorsBtn" title="Map settings">🗺 <span class="btn-label">Map settings</span></button>
    <button type="button" id="panelToggleBtn" title="Hide/show the city list">▾ Hide list</button>
    <button type="button" id="listCollapseBtn" title="Collapse city list" aria-label="Collapse city list" aria-controls="panel" aria-expanded="true"><svg viewBox="0 0 9 14" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 1.5 7 7l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="mapColorsPopover">
      <div class="pop-title-row"><span class="pop-title">🗺 Map Settings</span><button type="button" id="resetMapColors" class="reset-icon-btn" title="Reset map colours">↺</button></div>
      <div class="row"><span class="lbl">Land</span><input type="color" id="landColor" value="#e8e4da"/></div>
      <div class="row"><span class="lbl">Sea</span><input type="color" id="seaColor" value="#c8dff0"/></div>
      <div class="row"><span class="lbl">Borders</span><input type="color" id="borderColor" value="#aaaaaa"/></div>
    </div>
    <div id="dotAppearancePopover">
      <div class="pop-title-row"><span class="pop-title"><svg width="12" height="12" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-1px"><defs><clipPath id="ballClipPop"><circle cx="10" cy="10" r="9"/></clipPath><radialGradient id="ballGlossPop" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity="0.6"/><stop offset="45%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#000" stop-opacity="0.2"/></radialGradient></defs><g clip-path="url(#ballClipPop)"><rect x="0" y="0" width="20" height="20" fill="#f4c531"/><path d="M10 10 L20 10 A10 10 0 0 1 10 20 Z" fill="#3fb84f"/><path d="M10 10 L10 20 A10 10 0 0 1 0 10 Z" fill="#3b82f6"/><path d="M10 10 L0 10 A10 10 0 0 1 10 0 Z" fill="#e63946"/></g><circle cx="10" cy="10" r="9" fill="url(#ballGlossPop)"/></svg> Dot Appearance</span></div>
      <div class="row mode-toggles">
        <label class="mode-toggle" title="Night mode" aria-label="Night mode"><input type="checkbox" id="nightMode"><span class="mode-ico">🌙</span></label>
        <label class="mode-toggle" title="Physical mode" aria-label="Physical mode"><input type="checkbox" id="physicalMode"><span class="mode-ico">🛰️</span></label>
        <label class="mode-toggle" title="Pin mode" aria-label="Pin mode"><input type="checkbox" id="pinMode"><span class="mode-ico">📍</span></label>

      </div>
      <div class="row">
        <span class="lbl">Dot size</span>

      <div class="scale-presets" id="dotSizePresets">
        <button type="button" class="scale-preset-btn active" data-size-mode="normal">Normal</button>
        <button type="button" class="scale-preset-btn" data-size-mode="small">Small</button>
        <button type="button" class="scale-preset-btn" data-size-mode="smaller">Smaller</button>

    <div class="tooltip" id="tooltip"></div>

  <div id="bottomPanels">

<script>
// ─── REGION DEFINITIONS ──────────────────────────────────────────────────────
// Each region: projection type, center [lon,lat], scale, clip bounds [lon0,lat0,lon1,lat1], color, countries (ISO-2 codes matching the DB)
const REGIONS = {
  world: {
    label:'World', color:'#2B4C7E',
    makeProj: (W,H) => d3.geoNaturalEarth1().scale(W/6.3).translate([W/2, H/2]),
    countries: null,
    clip: null,
  },
  europe: {
    label:'Europe', color:'#1565C0',
    makeProj: (W,H) => d3.geoMercator().center([15, 54]).scale(Math.min(W,H)*1.05).translate([W/2, H/2]),
    clip: [-25, 35, 45, 72],
    countries: ['AL','AD','AT','BY','BE','BA','BG','HR','CY','CZ','DK','EE','FI','FO','FR','DE','GR','HU','IS','IE','IT','XK','LV','LI','LT','LU','MT','MD','MC','ME','NL','MK','NO','PL','PT','RO','SM','RS','SK','SI','ES','SE','CH','UA','GB','VA','RU','GG','JE','IM'],
    // Europe's clip box brushes against North Africa and parts of the Middle
    // East / Caucasus, so those countries' land would otherwise still be
    // drawn at the edges. This restricts rendered land to the country list
    // above (Spain/Portugal still render whole, Atlantic islands included).
    strictCountries: true,
    // Russia straddles the Europe/Asia line, so simply allowing country
    // code 'RU' would also allow Siberian/Far-East cities that are nowhere
    // near this map. Only cities at or west of this longitude (roughly the
    // Ural Mountains) count as "in Europe" for guessing and stats.
    russiaMaxLon: 60,
  },
  north_america: {
    label:'North America', color:'#6A1B9A',
    makeProj: (W,H) => d3.geoMercator().center([-95, 48]).scale(Math.min(W,H)*0.62).translate([W/2, H/2]),
    clip: [-170, 8, -50, 84],
    countries: ['US','CA','MX','CU','JM','HT','DO','PR','GT','BZ','HN','SV','NI','CR','PA','TT','BS','BB','AG','DM','GD','KN','LC','VC','AW','CW','SX','VG','VI','KY','TC','AI','MS','GP','MQ','MF','BL','BQ','PM','BM'],
    // Without this, any country whose land merely overlaps the viewport
    // gets drawn — which pulls in a strip of Colombia/Venezuela south of
    // Panama. Restrict rendered land to the country list above, so the
    // region stops cleanly at Panama.
    strictCountries: true,
  },
  south_america: {
    label:'South America', color:'#2E7D32',
    makeProj: (W,H) => d3.geoMercator().center([-60, -15]).scale(Math.min(W,H)*0.72).translate([W/2, H/2]),
    clip: [-82, -56, -34, 13],
    countries: ['AR','BO','BR','CL','CO','EC','GY','PY','PE','SR','UY','VE','GF','FK'],
    // Restrict rendered land to the country list above, so the region runs
    // cleanly from Colombia down through the southern tip of the continent
    // without Central America/Caribbean land bleeding in at the north edge.
    strictCountries: true,
  },
  africa: {
    label:'Africa', color:'#BF360C',
    makeProj: (W,H) => d3.geoMercator().center([20, 3]).scale(Math.min(W,H)*0.72).translate([W/2, H/2]),
    clip: [-20, -36, 52, 38],
    countries: ['DZ','AO','BJ','BW','BF','BI','CM','CV','CF','TD','KM','CD','CG','DJ','EG','GQ','ER','ET','GA','GM','GH','GN','GW','CI','KE','LS','LR','LY','MG','MW','ML','MR','MU','MA','MZ','NA','NE','NG','RW','SC','ST','SN','SL','SO','ZA','SS','SD','SZ','TZ','TG','TN','UG','ZM','ZW','EH','RE','YT','SH'],
    // Restrict rendered land to the continent and its island nations above,
    // so the Arabian Peninsula/southern Europe don't bleed in at the edges.
    strictCountries: true,
  },
  asia: {

// A city counts as "in" a region if its country is on the region's country
// list — with one extra carve-out: Russia straddles Europe and Asia, so
// russiaMaxLon/russiaMinLon (set on the Europe/Asia region defs above)
// additionally split Russian cities by longitude at the Urals, even though
// 'RU' appears on both regions' country lists. Used everywhere a city needs
// to be checked against the current region: guessing, stats totals, and the
// "what did I miss" report.
function cityInRegion(c, regionDef) {
  if (regionDef.countries && !regionDef.countries.includes(c.country)) return false;
  if (c.country === 'RU') {
    if (regionDef.russiaMaxLon != null && !(typeof c.lon === 'number' && c.lon <= regionDef.russiaMaxLon)) return false;
    if (regionDef.russiaMinLon != null && !(typeof c.lon === 'number' && c.lon >= regionDef.russiaMinLon)) return false;
  }
  return true;
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let cityDB = [], countriesList = [], found = [], missed = 0;
let projection, currentTransform = d3.zoomIdentity;
let currentRegion = 'world';
const W_BASE = 1000, H_BASE = 500;

const S = {
  dotColor:'#cb6543', dotAlpha:0.75, uniformSize:false, uniformR:0, dotSizeMode:'normal',
  landColor:'#e8e4da', seaColor:'#c8dff0', borderColor:'#aaaaaa',
  countryMode:'any', specificCountry:'',
  nightMode:false, _preNight:null, // _preNight: colours saved when night mode is switched on, restored when switched off
  physicalMode:false, // shows a real satellite-image basemap instead of flat land/sea colours
  pinMode:false, // Pin mode: dots render as 3D-style map pins instead of flat circles
};

// Fixed 4-colour palette for Pin mode — ball fill and a darker shade of the
// same hue for the shaft, so the pin reads as one coherent solid object. Each
// pin gets one of these at random (equal 25% odds) the moment it's placed —
// there's no user-facing colour picker; see randomPinColorKey / addDot.
const PIN_COLORS = { red:'#e63946', yellow:'#f4c531', blue:'#3b82f6', green:'#3fb84f' };
const PIN_COLORS_DARK = { red:'#9c2530', yellow:'#b8901f', blue:'#28568a', green:'#2c8a3a' };
const PIN_COLOR_KEYS = Object.keys(PIN_COLORS);
function randomPinColorKey() { return PIN_COLOR_KEYS[Math.floor(Math.random() * PIN_COLOR_KEYS.length)]; }

// Preset used when Night mode is enabled — sea darker than land, and warm
// bright dots so cities read like lights photographed from space.
const NIGHT_PRESET = { landColor:'#0d1420', seaColor:'#020409', borderColor:'#25324a', dotColor:'#ffe9a8', dotAlpha:0.92 };

// Factory defaults for the "Dot Appearance" section (colour/alpha/size/scale only —
// Night mode and Physical mode are toggles the user explicitly set and are never
// touched by the reset button).
const DOT_DEFAULTS = { dotColor:'#cb6543', dotAlpha:0.75, uniformSize:false, uniformR:0, dotSizeMode:'normal' };
const MAP_DEFAULTS = { landColor:'#e8e4da', seaColor:'#c8dff0', borderColor:'#aaaaaa' };

// The four dot-size presets. "normal" sizes dots by population, same as
// before. Small/Smaller/Tiny instead fix every dot to the same size
// regardless of population, so shrinking reads as "everything is now one
// small dot" rather than preserving relative city size at a smaller scale.
const NORMAL_MIN_R = 0.6 * 0.87; // matches logPopR's own floor below
const DOT_SIZE_MODES = {
  normal:  { uniform: false, scale: 1, floor: 0.5 },
  small:   { uniform: true,  r: 1.0 },
  smaller: { uniform: true,  r: 0.6 },
  tiny:    { uniform: true,  r: 0.3 },
};

// ─── POP SCALE ───────────────────────────────────────────────────────────────
// Log scale: each order of magnitude gets equal visual weight
// Cube-root scale: r = k * cbrt(population)
// Derived from volume ∝ population — no arbitrary parameters.
// k is set so a 35M-person megacity reaches ~13px at base zoom.
// Standard (100%) dot size was rescaled down to what used to be the 87%
// setting — i.e. the old "87%" look is now the new default/100% baseline.
const CBRT_K = 13 / Math.pow(35000000, 1/3) * 0.87;
function logPopR(pop) {
  return Math.max(NORMAL_MIN_R, CBRT_K * Math.pow(Math.max(1, pop || 1), 1/3));
}
// Reference projection scale for the world view — used to normalise dot sizes
// across regions so a city always looks the same size relative to geography.
const WORLD_PROJ_SCALE_REF = 1000 / 6.3; // ≈158 — world view scale at W=1000
let currentProjScale = WORLD_PROJ_SCALE_REF;

function dotR(pop) {
  const modeCfg = DOT_SIZE_MODES[S.dotSizeMode] || DOT_SIZE_MODES.normal;
  // Regional views have a larger projection scale than world — use sqrt of the
  // ratio so dots grow proportionally bigger when zoomed into a region.
  const scaleFactor = Math.sqrt(currentProjScale / WORLD_PROJ_SCALE_REF);
  if (modeCfg.uniform) return Math.max(0.15, modeCfg.r * scaleFactor);
  const base = logPopR(pop) * modeCfg.scale;
  return Math.max(modeCfg.floor, base * scaleFactor);
}

// ─── PIN MODE (3D-style pin markers) ───────────────────────────────────────
// Same population-driven radius as the flat dot (dotR) scaled up into a
// pushpin: a round "ball" head offset up and slightly sideways from the
// actual location (perspective lean), connected by a thin shaft, with a
// soft ground shadow at the anchor point and a white gloss highlight on the
// ball to read as a glossy sphere.
function pinGeom(pop) {
  const ballR = Math.max(0.9, dotR(pop) * 1.6);
  return { ballR, shaftLen: ballR * 1.9, lean: ballR * 0.55 };
}
// (Re)position every element of one city's pin group at its anchor point.
function applyPinGeom(pg, cx, cy, pop) {
  const g = pinGeom(pop);
  const bx = cx + g.lean, by = cy - g.shaftLen;
  pg.select('.pin-shadow').attr('cx', cx).attr('cy', cy).attr('rx', g.ballR * 0.5).attr('ry', g.ballR * 0.2);
  pg.select('.pin-shaft').attr('x1', cx).attr('y1', cy).attr('x2', bx).attr('y2', by).attr('stroke-width', Math.max(0.35, g.ballR * 0.28));
  pg.select('.pin-ball').attr('cx', bx).attr('cy', by).attr('r', g.ballR).attr('data-pop', pop || 0);
  pg.select('.pin-gloss').attr('cx', bx - g.ballR * 0.32).attr('cy', by - g.ballR * 0.35).attr('rx', g.ballR * 0.34).attr('ry', g.ballR * 0.22);
}
// Apply this pin's own already-assigned colour (stored on the group as
// data-pin-color when it was first placed — see addDot) to its elements.
function applyPinColorTo(pg) {
  const key = pg.attr('data-pin-color') || 'red';
  pg.select('.pin-ball').attr('fill', PIN_COLORS[key] || PIN_COLORS.red);
  pg.select('.pin-shaft').attr('stroke', PIN_COLORS_DARK[key] || PIN_COLORS_DARK.red);
}
// Re-apply every pin's own colour (called when Pin mode is toggled on, etc).
function applyPinStyles() {
  svg.selectAll('.city-dot .pin-group').each(function(){ applyPinColorTo(d3.select(this)); });
}
// Re-position every pin (called alongside refreshDotSizes when the dot-size
// preset or region scale changes, since pin size/lean/shaft all derive from
// the same population-based radius).
function refreshPinGeom() {
  svg.selectAll('.city-dot').each(function(){
    const dg = d3.select(this);
    const pg = dg.select('.pin-group');
    if (pg.empty()) return;
    const main = dg.select('circle.main-dot');
    const cx = +main.attr('cx'), cy = +main.attr('cy'), pop = +main.attr('data-pop');
    applyPinGeom(pg, cx, cy, pop);
  });
}

// ─── SVG / ZOOM ───────────────────────────────────────────────────────────────
const svg = d3.select('#map');
const zoomBehavior = d3.zoom().scaleExtent([0.5, 30])
  .on('start', onZoomStart)
  .on('zoom', onZoom)
  .on('end', onZoomEnd);

// Dragging feels smooth because the transform tracks the pointer continuously —
// it's physically glued to your hand. Mouse-wheel zoom is fundamentally
// different: d3-zoom's default wheel handling snaps the scale straight to its
// new value the instant each wheel tick arrives, with no interpolation between
// ticks. On a notch-based mouse wheel each notch is a separate abrupt jump;
// even on a trackpad, a burst of ticks moves the view in a series of small
// discrete snaps rather than one continuous motion. That's what reads as
// "clunky" even when frame rate is perfectly healthy — the motion itself
// isn't continuous. Fix: take over wheel handling ourselves and apply each
// tick through a short eased transition instead of an instant jump, so a
// burst of ticks blends into one smooth, continuous zoom the same way drag
// already feels continuous.
const _defaultZoomFilter = zoomBehavior.filter();
zoomBehavior.filter(function (event, ...args) {
  return event.type !== 'wheel' && _defaultZoomFilter.call(this, event, ...args);
});
// Mirrors d3-zoom's own default wheel-delta formula exactly, so per-tick zoom
// amount feels identical to before — only *how* it's applied (eased over a
// short transition instead of instantly) changes.
function wheelZoomFactor(event) {
  const delta = -event.deltaY * (event.deltaMode === 1 ? 0.05 : event.deltaMode ? 1 : 0.002) * (event.ctrlKey ? 10 : 1);
  return Math.pow(2, delta);
}
document.getElementById('mapWrap').addEventListener('wheel', function (event) {
  event.preventDefault();
  const point = d3.pointer(event, svg.node());
  const factor = wheelZoomFactor(event);
  // A fresh .transition() on the same (default, unnamed) selection
  // automatically interrupts whatever transition is still running from the
  // previous tick, so rapid ticks naturally chain into one continuous ease
  // rather than fighting each other.
  svg.transition().duration(140).ease(d3.easeCubicOut)
    .call(zoomBehavior.scaleBy, factor, point);
}, { passive: false });

// While actively dragging/zooming the map, the per-dot glow filter (blur +
// screen blend) is the main thing making Night mode feel laggy — the browser
// has to re-rasterize every city light's blur on every frame. We drop down
// to plain, unblurred/unblended dots for the duration of the gesture (see the
// body.map-panning CSS rule) and restore full glow once it settles, so the
// map stays smooth while interacting without changing how it looks at rest.
//
// Mouse-wheel zoom fires as a burst of discrete ticks, often with small gaps
// between them — long enough that d3-zoom treats each tick as its own
// start→end gesture rather than one continuous one. Toggling the class
// straight off d3's 'end' event therefore flickered it back on between
// ticks (re-enabling the expensive filter mid-scroll). Instead, 'end' is
// only used as a fallback, and the class is actually cleared by a debounce
// timer that keeps getting pushed back as long as ticks keep arriving —
// so a whole burst of wheel ticks (or a drag) reads as one lightweight
// stretch, and full glow only comes back once input truly stops.
let _panningOffTimer = null;
function onZoomStart(e) {
  if (!S.nightMode) return;
  document.body.classList.add('map-panning');
  clearTimeout(_panningOffTimer);
}
function onZoomEnd(e) {
  clearTimeout(_panningOffTimer);
  _panningOffTimer = setTimeout(() => {
    document.body.classList.remove('map-panning');
  }, 220);
}

let _physicalZoomTimer = null;
// The transform that was "baked into" the pixels of the satellite raster the
// last time it was rendered (see renderPhysicalBasemap). Between re-renders,
// this lets us work out exactly how much further the view has moved since
// then, so the raster can be nudged by that same amount and stay glued to
// the borders instead of lagging behind them.
let _physicalBakedTransform = d3.zoomIdentity;

// d3-zoom fires the same 'zoom' event for both dragging and wheel-zooming, and
// onZoom's own work (DOM lookups, the night-mode canvas redraw, the physical
// raster transform) is identical either way — so that's not what makes zoom
// feel clunkier than drag. The actual asymmetry is upstream, at the browser
// level: mousemove (drag) is naturally paced to the display's refresh rate,
// but wheel events — especially from trackpads — are not coalesced to that
// rate, so a single visible frame of scrolling can deliver dozens of native
// 'zoom' events. Previously each one re-queried the DOM and redrew the night
// canvas synchronously, so wheel-zoom was doing many times more work per
// rendered frame than drag ever does. Fix: keep recording the latest
// transform on every event (cheap), but defer the actual work to a single
// requestAnimationFrame callback, so no matter how many ticks arrive, the
// expensive part runs at most once per frame — same cadence as drag.
let _zoomFrameQueued = false;
function onZoom(e) {
  currentTransform = e.transform;
  if (_zoomFrameQueued) return;
  _zoomFrameQueued = true;
  requestAnimationFrame(applyZoomFrame);
}

function applyZoomFrame() {
  _zoomFrameQueued = false;
  if (!projection) return; // guards a same-frame race during an in-flight region switch
  const t = currentTransform;
  const mapGNode = document.getElementById('map-g');
  if (mapGNode) mapGNode.style.transform = `translate(${t.x}px,${t.y}px) scale(${t.k})`;
  document.getElementById('zoomLbl').textContent = Math.round(t.k * 100) + '%';
  drawNightCanvas();
  // The satellite raster lives in an untransformed layer (see renderPhysicalBasemap)
  // so it stays sharp instead of being stretched by this transform — but that means
  // it has to be regenerated for the new view. Regenerating on every frame would be
  // too slow, so instead: (1) apply a live CSS-style transform to the raster layer
  // itself, relative to the view it was last rendered for, so it scales/pans in
  // perfect lockstep with the borders on every single frame instead of lagging
  // behind, then (2) debounce a full pixel-perfect re-render for once the view
  // settles, which snaps the raster back to fully sharp and resets this live
  // transform to identity.
  if (S.physicalMode) {
    const base = _physicalBakedTransform;
    const k = t.k / base.k;
    const tx = t.x - base.x * k;
    const ty = t.y - base.y * k;
    const physicalGNode = document.getElementById('physical-g');
    if (physicalGNode) physicalGNode.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
    clearTimeout(_physicalZoomTimer);
    _physicalZoomTimer = setTimeout(() => {
      const [W, H] = getMapSize();
      renderPhysicalBasemap(W, H).catch(err => console.error('Physical mode: re-render on zoom/pan failed', err));
    }, 150);
  }
}

function getMapSize() {
  const el = document.getElementById('mapWrap');
  return [el.clientWidth || 800, el.clientHeight || 480];
}

// ─── MAP DATA (multiple resolutions) ─────────────────────────────────────────
// 110m = lightweight, used for world view
// 50m  = detailed coastlines, used for all regional (non-world) views
const geoCache = { '110m': null, '50m': null, 'us-states': null, 'us-counties': null, 'japan-prefs': null };

async function getGeoData(res) {
  if (geoCache[res]) return geoCache[res];
  const urls = {
    '50m':        'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json',
    '110m':       'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
    'us-states':  'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json',
    'us-counties':'https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json',
    // Prefecture-level Japan boundaries (all 47 prefectures, each a MultiPolygon
    // so every outlying island — Hokkaido, Okinawa, the Izu/Amami chains,
    // Tsushima, Sado, etc. — is included, not just the four main islands the
    // low-res world atlas roughly traces).
    'japan-prefs':'https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.topojson',
    // Spain's provinces (+ Ceuta and Melilla), with the autonomous-community
    // outlines in the same file, from the IGN via the es-atlas package.
    // Real lon/lat coordinates, so the Canary Islands sit where they really are.
    'es-provinces': [
      'https://cdn.jsdelivr.net/npm/es-atlas@0.6.0/es/provinces.json',
      'https://unpkg.com/es-atlas@0.6.0/es/provinces.json',
    ],
    // Poland's 16 voivodeships (GeoJSON, real lon/lat, ~1.3 MB, one feature per
    // voivodeship with its Polish name in properties.nazwa) from ppatrzyk/polska-geojson.
    'pl-voivodeships': [
      'https://cdn.jsdelivr.net/gh/ppatrzyk/polska-geojson@master/wojewodztwa/wojewodztwa-medium.geojson',
      'https://raw.githubusercontent.com/ppatrzyk/polska-geojson/master/wojewodztwa/wojewodztwa-medium.geojson',
    ],
  };
  let lastErr;
  for (const url of [].concat(urls[res])) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
      geoCache[res] = await r.json();
      return geoCache[res];
    } catch (err) { lastErr = err; }
  }
  throw lastErr;
}

// Pre-fetch 110m immediately so world loads fast; kick off 50m + US/Japan data in background
getGeoData('110m');
setTimeout(() => getGeoData('50m'), 800);
setTimeout(() => { getGeoData('us-states'); getGeoData('us-counties'); getGeoData('japan-prefs'); getGeoData('es-provinces').catch(() => {}); getGeoData('pl-voivodeships').catch(() => {}); }, 1200);

// A handful of tiny multi-island countries in the high-res 10m atlas (e.g. the
// Maldives) have a few individual polygons whose ring winding is backwards.
// Rendered as-is, such a polygon is interpreted as "everything except this
// sliver" and fills the whole map, hiding the sea and any coastline detail.
// No genuine country polygon gets anywhere near this large, so any single
// polygon whose spherical area exceeds ~1 steradian (Russia's largest single
// landmass is ~0.4 sr) is reversed back to the correct winding.
function fixInvertedWinding(feature) {
  const geom = feature.geometry;
  const fixPoly = (polyCoords) => {
    const area = Math.abs(d3.geoArea({ type: 'Polygon', coordinates: polyCoords }));
    if (area > 1) polyCoords.forEach(ring => ring.reverse());
  };
  if (geom.type === 'Polygon') fixPoly(geom.coordinates);
  else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(fixPoly);
  return feature;
}

// Russia is one continuous landmass straddling Europe and Asia, so it can't
// be included/excluded whole the way strictCountries handles every other
// country — each region needs to show only its own side of it. This clips a
// feature's geometry to a lon <= threshold (keepEast=false) or lon >=
// threshold (keepEast=true) half-plane using a standard Sutherland-Hodgman
// clip, ring by ring; rings that end up with fewer than 3 points (fully on
// the discarded side, e.g. Kaliningrad when clipping to "east of the
// Urals") are dropped entirely.
//
// Russia's Far East coastline crosses the ±180° antimeridian, where
// longitude jumps straight from ~179 to ~-179. Comparing those raw values
// against a threshold of 60 (Urals) would treat -179 as "west" even though
// it's actually the easternmost point on Earth — corrupting the clip badly
// (that's what caused Asia's map to come out mangled). unwrapLongitudes
// removes that jump by letting the longitude run continuously past ±180 for
// the purposes of the clip; rewrapLon puts the final coordinates back in
// the normal range afterward.
function unwrapLongitudes(ring) {
  const out = [[ring[0][0], ring[0][1]]];
  for (let i = 1; i < ring.length; i++) {
    let lon = ring[i][0];
    const prevLon = out[i - 1][0];
    while (lon - prevLon > 180) lon -= 360;
    while (lon - prevLon < -180) lon += 360;
    out.push([lon, ring[i][1]]);
  }
  return out;
}
function rewrapLon(lon) {
  return ((lon + 180) % 360 + 360) % 360 - 180;
}
function clipRingByLon(ring, lonThreshold, keepEast) {
  const unwrapped = unwrapLongitudes(ring);
  const inside = p => keepEast ? p[0] >= lonThreshold : p[0] <= lonThreshold;
  const intersect = (a, b) => {
    const t = (lonThreshold - a[0]) / (b[0] - a[0]);
    return [lonThreshold, a[1] + t * (b[1] - a[1])];
  };
  const out = [];
  for (let i = 0; i < unwrapped.length; i++) {
    const curr = unwrapped[i], prev = unwrapped[(i - 1 + unwrapped.length) % unwrapped.length];
    const currIn = inside(curr), prevIn = inside(prev);
    if (currIn) {
      if (!prevIn) out.push(intersect(prev, curr));
      out.push(curr);
    } else if (prevIn) {
      out.push(intersect(prev, curr));
    }
  }
  if (out.length < 3) return [];
  out.push(out[0]); // re-close the ring
  return out.map(([lon, lat]) => [rewrapLon(lon), lat]);
}
function clipFeatureByLon(feature, lonThreshold, keepEast) {
  const geom = feature.geometry;
  const clipPoly = polyCoords => {
    const rings = polyCoords.map(ring => clipRingByLon(ring, lonThreshold, keepEast));
    if (rings[0].length < 4) return []; // outer ring didn't survive the clip
    return rings.filter(ring => ring.length >= 4);
  };
  let coordinates;
  if (geom.type === 'Polygon') {
    const clipped = clipPoly(geom.coordinates);
    coordinates = clipped.length ? clipped : [];
  } else if (geom.type === 'MultiPolygon') {
    coordinates = geom.coordinates.map(clipPoly).filter(poly => poly.length);
  } else {
    coordinates = geom.coordinates;
  }
  return { ...feature, geometry: { ...geom, coordinates } };
}

// Same idea as clipRingByLon, but for an open polyline (a border arc) rather
// than a closed ring. A shared border can cross the lon threshold, or lie
// entirely on the discarded side (e.g. Russia–Georgia and Russia–Azerbaijan,
// both entirely west of the Urals, yet Georgia/Azerbaijan themselves are
// still fully rendered in the Asia view) — so this can hand back zero, one,
// or several line pieces, keeping only the portion(s) on the retained side.
function clipLineByLon(coords, lonThreshold, keepEast) {
  const unwrapped = unwrapLongitudes(coords);
  const inside = p => keepEast ? p[0] >= lonThreshold : p[0] <= lonThreshold;
  const intersect = (a, b) => {
    const t = (lonThreshold - a[0]) / (b[0] - a[0]);
    return [lonThreshold, a[1] + t * (b[1] - a[1])];
  };
  const segments = [];
  let current = [];
  for (let i = 0; i < unwrapped.length; i++) {
    const curr = unwrapped[i];
    if (inside(curr)) {
      if (current.length === 0 && i > 0 && !inside(unwrapped[i - 1])) {
        current.push(intersect(unwrapped[i - 1], curr));
      }
      current.push(curr);
    } else if (current.length > 0) {
      current.push(intersect(unwrapped[i - 1], curr));
      segments.push(current);
      current = [];
    }
  }
  if (current.length > 0) segments.push(current);
  return segments
    .filter(seg => seg.length >= 2)
    .map(seg => seg.map(([lon, lat]) => [rewrapLon(lon), lat]));
}

// ─── REGION QUIZ MODE (Japan prefectures / US states) ──────────────────────
// A find-and-click practice mode for maps that have one (see QUIZ_CFG): while
// toggled on, a label follows the cursor at all times naming a randomly-chosen
// region (a Japanese prefecture, or a US state) the user must find and click
// on the map. A correct click solves it (tinted permanently) and immediately
// asks for the next one, picked at random from whatever's left, until every
// region has been asked exactly once. A wrong click briefly flashes red
// feedback without revealing where the right answer is. Progress persists
// only while the quiz stays on — leaving it (switching to the normal typing
// mode, or to any other map) wipes progress and the tinted regions, so the
// map and the city-typing bar come back exactly as they were before the quiz
// started (see setQuizMode).
let quizMode = false;
let quizRegion = null;             // 'japan' | 'usa' | 'spain' | 'poland' while quizMode is on, else null (selects the entry in QUIZ_CFG)
const quizSolved = new Set();      // region keys answered correctly so far (numbers for Japan, state abbreviations for the US)
const quizSolvedTier = new Map();  // key -> 'yellow'|'red' for a solved region that took extra guesses (absent = solved on the first try, plain blue)
let quizWrongCount = 0;            // wrong guesses made so far while hunting for the CURRENT target; resets each time a new target is picked
let quizHoverOutline = null;       // d3 selection of the hover-outline overlay path (see drawMap)
let quizQueue = [];                // remaining keys still to be asked, shuffled
let quizTargetId = null;           // key currently being asked, or null if none/complete
let quizFeedbackTimer = null;      // pending revert-to-target-name timeout
let lastPointerXY = null;          // last known {x,y} viewport coords, for positioning the label the instant quiz mode turns on

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Config for the map the quiz is currently running on (null when it's off).
function quizCfg() { return (quizRegion && QUIZ_CFG[quizRegion]) || null; }

function updateQuizIndicator() {
  const el = document.getElementById('quizIndicator');
  if (!el) return;
  el.classList.toggle('on', quizMode);
  const cfg = quizCfg();
  if (!cfg) return;
  el.title = cfg.indicatorTitle;
  const iconEl = document.getElementById('quizIndicatorIcon');
  if (iconEl) iconEl.textContent = cfg.icon;
  const progEl = document.getElementById('quizIndicatorProgress');
  if (progEl) progEl.textContent = `${quizSolved.size}/${cfg.ids.length}`;
}

// Start (or resume) a round: if nothing is queued/asked yet and there's still
// something left to solve, build a fresh shuffled order of the remaining
// regions and pull the first one.
function quizEnsureTarget() {
  const cfg = quizCfg();
  if (!cfg) return;
  if (quizTargetId != null || quizQueue.length) return;
  if (quizSolved.size >= cfg.ids.length) { quizTargetId = null; return; }
  quizQueue = shuffleArray(cfg.ids.filter(id => !quizSolved.has(id)));
  quizTargetId = quizQueue.shift();
}

// After this many wrong guesses on the same target, the correct region starts
// blinking (i.e. the 4th attempt gets the hint). Solving it after the hint
// still counts as 3+ misses, so it ends up in the red tier.
const QUIZ_HINT_AFTER_WRONG = 3;
function quizHintActive() {
  return quizMode && quizTargetId != null && quizWrongCount >= QUIZ_HINT_AFTER_WRONG;
}
// (Re)apply the blink to whichever region is the current target, clearing it
// from everything else. Safe to call any time the target / wrong count changes.
function quizUpdateHint() {
  const cfg = quizCfg();
  const active = quizHintActive() && cfg;
  d3.selectAll('#countries-g path.quiz-hint-blink').classed('quiz-hint-blink', false);
  if (!active) return;
  d3.selectAll('#countries-g path')
    .filter(d => d && cfg.keyOf(d) === quizTargetId)
    .classed('quiz-hint-blink', true);
}

function quizCurrentPromptText() {
  const cfg = quizCfg();
  if (!cfg) return '';
  if (quizTargetId != null) return `Find: ${cfg.names[quizTargetId] || '?'}`;
  return quizSolved.size >= cfg.ids.length ? `🎉 All ${cfg.ids.length} found!` : '';
}

// Forget all progress and un-tint every region, leaving the quiz mode flag
// itself alone. Shared by "leave the quiz", "switch to the other map's quiz",
// and the indicator's reset button.
function quizClearProgress() {
  clearTimeout(quizFeedbackTimer);
  quizSolved.clear();
  quizSolvedTier.clear();
  quizWrongCount = 0;
  quizQueue = [];
  quizTargetId = null;
  quizUpdateHint();
  d3.selectAll('#countries-g path.quiz-solved')
    .classed('quiz-solved', false)
    .classed('quiz-solved-yellow', false)
    .classed('quiz-solved-red', false);
}

// Turn the find-and-click quiz on/off for map `rk` ('japan' | 'usa'). This is
// the single entry point for entering/leaving the mode — called when the user
// picks a map's quiz option in the map selector (see setRegion and the mode
// picker), and when leaving that map entirely (see drawMap).
function setQuizMode(on, rk) {
  const prevRegion = quizRegion;
  quizMode = !!on;
  quizRegion = quizMode ? rk : null;
  clearTimeout(quizFeedbackTimer);
  quizWrongCount = 0;
  quizUpdateHint();
  // Progress belongs to ONE map's quiz: jumping straight from the Japan quiz
  // to the US quiz (or vice versa) must not carry solved regions across.
  if (quizMode && prevRegion !== rk) quizClearProgress();
  const wrap = document.getElementById('mapWrap');
  if (wrap) wrap.classList.toggle('quiz-active', quizMode);
  // The city-typing bar (and its Find/Clear all buttons) isn't used while
  // hunting for regions by click, so hide it — toggled on <body> since
  // #inputControls lives in the session bar, outside #mapWrap.
  document.body.classList.toggle('quiz-typing-hidden', quizMode);
  // The bottom stats panel (Top Countries/States/Prefectures silhouettes + the
  // population/capitals percentage rows) is all keyed off typed-and-found
  // cities, which the click-quiz never populates — so it's meaningless here
  // and gets hidden for the duration of the quiz (see #bottomPanels CSS).
  document.body.classList.toggle('quiz-mode', quizMode);
  if (quizMode) {
    quizEnsureTarget();
    const text = quizCurrentPromptText();
    if (text) showQuizTooltip(lastPointerXY, text, quizTargetId == null ? 'complete' : '');
  } else {
    hideQuizTooltip();
    // Leaving the quiz (back to the normal typing mode, or to any other
    // map): wipe progress and un-tint every region so the map looks exactly
    // like it did before the quiz was ever turned on. Without this,
    // quizSolved/quizSolvedTier would still hold the old answers and a later
    // redraw (e.g. a window resize, see drawMap) would silently re-colour
    // those regions even outside the quiz.
    quizClearProgress();
  }
  // Night mode draws city lights on a canvas: clear it when entering the quiz,
  // repaint it when leaving so the earlier cities light up again.
  if (typeof drawNightCanvas === 'function' && projection) drawNightCanvas();
  updateQuizIndicator();
  // Swap the side panel between the typed-cities list and the found-regions
  // list (and back) to match the mode just entered/left.
  if (typeof renderFoundGrid === 'function') renderFoundGrid();
}

function resetQuizProgress(e) {
  if (e) e.stopPropagation();
  quizClearProgress();
  if (quizMode) {
    quizEnsureTarget();
    showQuizTooltip(lastPointerXY, quizCurrentPromptText());
  } else {
    hideQuizTooltip();
  }
  updateQuizIndicator();
  renderFoundGrid();
}

// `pos` is either a MouseEvent or a plain {clientX,clientY}-shaped object (or
// null, in which case the label just appears centred over the map).
function showQuizTooltip(pos, text, extraClass) {
  const el = document.getElementById('quizTooltip');
  const mapEl = document.getElementById('map');
  if (!el || !mapEl) return;
  const rc = mapEl.getBoundingClientRect();
  const cx = pos ? pos.clientX : rc.left + rc.width / 2;
  const cy = pos ? pos.clientY : rc.top + rc.height / 2;
  el.textContent = text;
  el.className = 'quiz-tooltip' + (extraClass ? ' ' + extraClass : '');
  el.style.left = (cx - rc.left + 14) + 'px';
  el.style.top  = (cy - rc.top - 34) + 'px';
  el.style.display = 'block';
}
function moveQuizTooltip(event) {
  const el = document.getElementById('quizTooltip');
  const mapEl = document.getElementById('map');
  if (!el || !mapEl) return;
  const rc = mapEl.getBoundingClientRect();
  el.style.left = (event.clientX - rc.left + 14) + 'px';
  el.style.top  = (event.clientY - rc.top - 34) + 'px';
  // Re-entering the map after a mouseleave hid the label: restore it showing
  // the current target (a pending correct/wrong feedback flash, if any, has
  // its own timer and will overwrite this shortly regardless).
  if (el.style.display !== 'block') {
    const text = quizCurrentPromptText();
    if (text) { el.textContent = text; el.className = 'quiz-tooltip' + (quizTargetId == null ? ' complete' : ''); el.style.display = 'block'; }
  }
}
function hideQuizTooltip() {
  const el = document.getElementById('quizTooltip');
  if (el) el.style.display = 'none';
}

// Called when a region shape is clicked while the quiz is active.
function quizHandleClick(event, key, targetEl) {
  if (!quizMode || quizTargetId == null) return;
  const cfg = quizCfg();
  if (!cfg) return;
  // Clicking a region that's already been answered correctly is a no-op: it
  // isn't a mistake, so no wrong-guess count, red flash or "Try again".
  if (quizSolved.has(key)) return;
  event.stopPropagation();
  clearTimeout(quizFeedbackTimer);
  const sel = d3.select(targetEl || event.currentTarget);

  if (key === quizTargetId) {
    quizSolved.add(key);
    // Colour reflects how many wrong guesses it took to get here this round:
    // errorless (blue, the default "quiz-solved" look) / one miss (yellow)
    // / two-or-more misses (red).
    if (quizWrongCount === 1) quizSolvedTier.set(key, 'yellow');
    else if (quizWrongCount >= 2) quizSolvedTier.set(key, 'red');
    sel.classed('quiz-solved', true)
      .classed('quiz-solved-yellow', quizSolvedTier.get(key) === 'yellow')
      .classed('quiz-solved-red', quizSolvedTier.get(key) === 'red');
    quizWrongCount = 0;
    showQuizTooltip(event, `✓ ${cfg.names[key] || '?'}`, 'correct');
    updateQuizIndicator();
    renderFoundGrid();
    quizTargetId = quizQueue.length ? quizQueue.shift() : null;
    quizUpdateHint();
    quizFeedbackTimer = setTimeout(() => {
      const text = quizCurrentPromptText();
      if (text) showQuizTooltip(lastPointerXY, text, quizTargetId == null ? 'complete' : '');
      else hideQuizTooltip();
    }, 700);
  } else {
    quizWrongCount++;
    quizUpdateHint();
    sel.classed('quiz-wrong-flash', true);
    setTimeout(() => sel.classed('quiz-wrong-flash', false), 450);
    showQuizTooltip(event, '✗ Try again', 'wrong');
    quizFeedbackTimer = setTimeout(() => {
      showQuizTooltip(lastPointerXY, quizCurrentPromptText());
    }, 700);
  }
}

// Wires a d3 selection of region <path>s (already data-joined and given their
// 'd') up for the quiz: re-applies the "solved" tint across redraws (e.g. on
// resize) so progress isn't visually lost, marks shapes that aren't part of
// the quiz as inert (e.g. DC / Puerto Rico on the US map), and hooks up the
// find-and-click check + hover outline. The handlers only act while the quiz
// is running on THIS map, so it's safe to attach them unconditionally.
function attachQuizHandlers(sel, path, regionKey) {
  const keyOf = d => QUIZ_CFG[regionKey].keyOf(d);
  return sel
    .classed('quiz-solved', d => quizSolved.has(keyOf(d)))
    .classed('quiz-solved-yellow', d => quizSolvedTier.get(keyOf(d)) === 'yellow')
    .classed('quiz-solved-red', d => quizSolvedTier.get(keyOf(d)) === 'red')
    .classed('quiz-inert', d => keyOf(d) == null)
    .classed('quiz-hint-blink', d => quizHintActive() && quizRegion === regionKey && keyOf(d) === quizTargetId)
    .on('click', function(event, d) {
      if (!quizMode || quizRegion !== regionKey) return;
      const key = keyOf(d);
      if (key == null) return;
      quizHandleClick(event, key);
    })
    // Drive the hover-outline overlay (see quizHoverOutline in drawMap,
    // appended after the border mesh so it always draws on top of it).
    .on('mouseenter', function(event, d) {
      if (!quizMode || quizRegion !== regionKey || !quizHoverOutline) return;
      if (keyOf(d) == null) return;
      quizHoverOutline.attr('d', path(d)).classed('show', true);
    })
    .on('mouseleave', function() {
      if (quizHoverOutline) quizHoverOutline.classed('show', false);
    });
}

// Small islands / small regions (Okinawa's islands, Hawaii's islands, ...) are
// only a few pixels wide, which makes them very hard to click. This adds an
// invisible, fat hit-area around every SMALL polygon of a quiz region. The
// hit-areas live in their own group drawn UNDERNEATH the real region shapes
// (just above the sea), so they only ever catch clicks in the empty sea right
// next to a small island — they can never steal clicks from a neighbouring
// region's land. The stroke uses vector-effect:non-scaling-stroke, so it stays
// a constant number of screen pixels at every zoom level. Clicks/hover are
// forwarded to the real region as if it had been clicked directly.
const QUIZ_HIT_MAX_AREA = 350;   // projected px² below which a polygon gets a bigger click target
const QUIZ_HIT_STROKE   = 20;    // screen px of clickable margin (total width, i.e. ~10px each side)
function attachQuizHitTargets(g, features, path, regionKey) {
  g.select('#quiz-hit-g').remove();
  const keyOf = d => QUIZ_CFG[regionKey].keyOf(d);
  const realEls = new Map();
  g.select('#countries-g').selectAll('path').each(function(d) {
    const k = d && keyOf(d);
    if (k != null) realEls.set(k, this);
  });
  const items = [];
  features.forEach(f => {
    const key = keyOf(f);
    if (key == null || !f.geometry) return;
