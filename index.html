function renderOtherStats() {
  const el = document.getElementById('otherStatsList');
  if (!el) return;
  const isUSA = currentRegion === 'usa';
  const isJapan = currentRegion === 'japan';
  const regionDef = REGIONS[currentRegion];

  // Filter cityDB to the current region
  const regionCities = cityDB.filter(c => cityInRegion(c, regionDef));

  // Current region's found cities
  const regionFound = found;

  // Helper: count found cities matching a predicate
  const foundCount = (pred) => regionFound.filter(pred).length;
  // Helper: count DB cities matching a predicate (deduplicated by name+country+admin1)
  const dbCount = (pred) => regionCities.filter(pred).length;

  // Build stat rows
  const rows = [];

  // Population thresholds
  for (const [thresh, label] of [[1000000,'over 1,000,000'],[500000,'over 500,000'],[100000,'over 100,000']]) {
    const total = dbCount(c => (c.pop||0) >= thresh);
    const got   = foundCount(c => (c.pop||0) >= thresh);
    const pct   = total ? ((got/total)*100).toFixed(1) : '0.0';
    rows.push({ label: `cities ${label}`, got, total, pct });
  }

  if (isUSA) {
    // States
    const totalStates = Object.keys(US_STATES).filter(k => k.length === 2 && !['PR','GU','VI','DC'].includes(k)).length; // 50
    const gotStates = new Set(regionFound.map(c => c.admin1).filter(Boolean)).size;
    const pctStates = ((gotStates/totalStates)*100).toFixed(1);
    rows.push({ label: 'states', got: gotStates, total: totalStates, pct: pctStates });

    // State capitals
    const totalCapitals = US_STATE_CAPITALS.size;
    const gotCapitals = new Set(regionFound.filter(c => { const st=US_STATE_CAPITALS.get(c.name.toLowerCase()); return st!==undefined && (c.admin1||'').toUpperCase()===st; }).map(c => US_STATE_CAPITALS.get(c.name.toLowerCase()))).size;
    const pctCapitals = ((gotCapitals/totalCapitals)*100).toFixed(1);
    rows.push({ label: 'state capitals', got: gotCapitals, total: totalCapitals, pct: pctCapitals });
  } else if (isJapan) {
    // Prefecture capitals — a city counts if its name matches one of the 47
    // prefectural seats (see isJPPrefCapital for why this no longer also
    // requires the raw admin1 code to match).
    const totalCapitals = JP_PREF_CAPITAL_BY_NAME.size; // 47
    const gotCapitals = new Set(
      regionFound
        .filter(c => isJPPrefCapital(c))
        .map(c => JP_PREF_CAPITAL_BY_NAME.get(jpCapitalKey(c)))
    ).size;
    const pctCapitals = ((gotCapitals/totalCapitals)*100).toFixed(1);
    rows.push({ label: 'prefecture capitals', got: gotCapitals, total: totalCapitals, pct: pctCapitals });
  } else {
    // Countries
    const applicableUN = regionDef.countries ? regionDef.countries.filter(c => UN_COUNTRIES.has(c)) : [...UN_COUNTRIES];
    const totalCountries = applicableUN.length;
    const gotCountries = new Set(regionFound.map(c => c.country).filter(c => UN_COUNTRIES.has(c))).size;
    const pctCountries = totalCountries ? ((gotCountries/totalCountries)*100).toFixed(1) : '0.0';
    rows.push({ label: 'countries', got: gotCountries, total: totalCountries, pct: pctCountries });

    // Capitals — one per country max (some countries have multiple PPLC entries)
    const capitalCountries = new Set(cityDB.filter(c => c.isCapital && UN_COUNTRIES.has(c.country) && cityInRegion(c, regionDef)).map(c => c.country));
    const totalCapitals = Math.min(capitalCountries.size, totalCountries);
    const gotCapitals   = new Set(regionFound.filter(c => c.isCapital && UN_COUNTRIES.has(c.country)).map(c => c.country)).size;
    const pctCapitals   = totalCapitals ? ((gotCapitals/totalCapitals)*100).toFixed(1) : '0.0';
    rows.push({ label: 'capitals', got: gotCapitals, total: totalCapitals, pct: pctCapitals });
  }

  el.innerHTML = '';
  rows.forEach(({ label, got, total, pct }) => {
    if (total === 0) return; // hide rows with no data
    const complete = total > 0 && got >= total;
    const row = document.createElement('div');
    row.className = 'stat-row' + (complete ? ' stat-complete' : '');
    row.innerHTML =
      `<span class="stat-label">${label}${complete ? '<span class="stat-check" title="Complete!">✓</span>' : ''}</span>` +
      `<span class="stat-val">${got} / ${total}</span>` +
      `<span class="stat-pct">${pct}%</span>`;
    el.appendChild(row);
  });

  if (!el.children.length) {
    el.innerHTML = '<div class="best-empty">Load a cities file to see stats</div>';
  }
}

let _highlightTimer = null;

function highlightCity(city) {
  const id = dotId(city);
  const targetEl = S.pinMode ? svg.select('#' + id + ' .pin-ball') : svg.select('#' + id + ' circle.main-dot');
  if (targetEl.empty()) return;

  // If the desktop city list is collapsed, open it so the clicked city's row is visible.
  if (window.expandCityList) window.expandCityList();

  // Clear any previous highlight
  applyDotStyles();
  applyPinStyles();
  svg.selectAll('.city-dot .pulse-ring').remove();
  svg.selectAll('.city-dot.force-visible').classed('force-visible', false);
  document.querySelectorAll('.fi.highlighted').forEach(el => el.classList.remove('highlighted'));
  clearTimeout(_highlightTimer);

  // In Night mode this dot is normally drawn on the canvas, not as an SVG
  // circle — temporarily make the real SVG element visible so the highlight
  // colour + pulse-ring animation below can use it as normal, and tell the
  // canvas to skip drawing its own glow underneath for the moment.
  if (S.nightMode) {
    nightHighlightId = id;
    svg.select('#' + id).classed('force-visible', true);
    drawNightCanvas();
  }

  // Highlight the dot in bright yellow
  if (S.pinMode) {
    targetEl.attr('fill', '#facc15');
  } else {
    targetEl.attr('fill', '#facc15').attr('fill-opacity', 1).attr('stroke', '#b45309').attr('stroke-width', 1.5);
  }

  // Add a ripple pulse ring
  const cx = +targetEl.attr('cx');
  const cy = +targetEl.attr('cy');
  const r  = +targetEl.attr('r');
  const group = svg.select('#' + id);

  // Recenter the map on this city (keeps the current zoom level, just pans)
  const [W, H] = getMapSize();
  const k = currentTransform.k;
  const centeredTransform = d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k);
  svg.transition().duration(600).call(zoomBehavior.transform, centeredTransform);

  for (let i = 0; i < 3; i++) {
    group.append('circle')
      .attr('class', 'pulse-ring')
      .attr('cx', cx).attr('cy', cy).attr('r', r)
      .attr('fill', 'none')
      .attr('stroke', '#facc15')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.9 - i * 0.25)
      .style('pointer-events', 'none')
      .transition().delay(i * 180).duration(900)
      .attr('r', r * 4).attr('opacity', 0)
      .remove();
  }

  // Highlight the card
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.add('highlighted');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Restore original colour after 2.5s
  _highlightTimer = setTimeout(() => {
    if (S.pinMode) {
      applyPinColorTo(svg.select('#' + id + ' .pin-group'));
    } else {
      targetEl.attr('fill', dotFill()).attr('fill-opacity', dotFillOpacity()).attr('stroke', dotStroke()).attr('stroke-width', dotStrokeWidth(+targetEl.attr('data-pop'))).attr('filter', dotFilter());
    }
    svg.selectAll('.city-dot .pulse-ring').remove();
    if (nightHighlightId === id) {
      nightHighlightId = null;
      svg.select('#' + id).classed('force-visible', false);
      drawNightCanvas();
    }
    if (card) card.classList.remove('highlighted');
  }, 2500);
}

function tintRegionSelect(rk) {

  const lbl = document.getElementById('mapPickLabel');

// ─── MAP SELECTION MODAL ─────────────────────────────────────────────────────
// Built from the (hidden) #regionSelect so the two can never drift apart.
// Japan and the USA are single entries like any other map; picking one opens a
// second, smaller modal (#modePickModal, wired up below) to choose Normal
// (plain city-finding) vs the region quiz (Prefectures / States).
function buildMapList() {
  const list = document.getElementById('mapList');
  const sel = document.getElementById('regionSelect');
  if (!list || !sel || list.dataset.built) return;
  sel.querySelectorAll('optgroup').forEach(og => {
    const group = document.createElement('div');
    group.className = 'map-group';
    const title = document.createElement('div');
    title.className = 'map-group-title';
    title.textContent = og.label;
    const grid = document.createElement('div');
    grid.className = 'map-grid';
    og.querySelectorAll('option').forEach(o => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'map-opt';
      btn.dataset.region = o.value;
      const icon = regionFlags[o.value]
        ? `<span class="map-opt-flag">${regionFlags[o.value]}</span>`
        : `<span class="map-opt-dot" style="background:${regionColors[o.value] || '#2B4C7E'}"></span>`;
      btn.innerHTML = `${icon}<span>${o.textContent}</span><span class="map-opt-check"></span>`;
      btn.onclick = () => {
        if (QUIZ_CFG[o.value]) { closeMapModal(); openModePickModal(o.value); return; }
        closeMapModal();
        if (o.value !== currentRegion) setRegion(o.value);
      };
      grid.appendChild(btn);
    });
    group.appendChild(title);
    group.appendChild(grid);
    list.appendChild(group);
  });
  list.dataset.built = '1';
}

function openMapModal() {
  buildMapList();
  tintRegionSelect(document.getElementById('regionSelect').value || currentRegion);
  document.getElementById('mapModal').classList.add('open');

  modePickRegion = rk;

    if (currentRegion === rk) {
      const changed = (quizMode && quizRegion === rk) !== quiz;
      setQuizMode(quiz, rk);
      tintRegionSelect(rk);
      // Japan draws the same prefecture shapes in both modes, so toggling is
      // just a class/state change. The USA map draws counties in Normal mode
      // but states in the quiz, so that one has to be rebuilt.
      if (changed && QUIZ_CFG[rk].geometryDiffers) {
        drawMap(rk).then(() => { renderFoundGrid(); renderBestCountries(); renderOtherStats(); updateSummary(); });
      }
      persistSession();
    } else setRegion(rk, quiz);
  };
});

function setRegion(rk, quizWanted) {
  // Save current region's cities before switching
  captureState._fbr[currentRegion] = found.map(c => ({...c}));

  if (QUIZ_CFG[rk]) setQuizMode(!!quizWanted, rk);
  tintRegionSelect(rk);

  // Load the new region's cities
  found = (captureState._fbr[rk] || []).map(c => ({...c}));

  drawMap(rk).then(() => {
    renderFoundGrid();
    renderBestCountries();
    renderOtherStats();
    updateSummary();
  });

  const rname = REGIONS[rk].label;
  setMsg(`Region: ${rname}.${REGIONS[rk].countries ? ' Only cities in this region will be accepted.' : ''}`, 'info');
  persistSession();
}

// ─── COUNTRY FILTER (lives inside the typing bar) ────────────────────────────
// One dropdown covers all three modes: "Any country", "Every country", and a
// specific country (values prefixed with "c:" so they can't collide with modes).
function populateCountryFilterOptions() {
  const list = document.getElementById('cfCountryList');
  if (!list) return;
  if (!countriesList.length) { list.innerHTML = '<div class="cf-empty">— load data first —</div>'; return; }
  const frag = document.createDocumentFragment();
  countriesList.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cf-opt';
    b.dataset.val = 'c:' + c;
    b.textContent = fmtCountry(c);
    frag.appendChild(b);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}

function syncCountryFilterUI() {
  const btn = document.getElementById('countryFilterBtn');
  const panel = document.getElementById('countryFilterPanel');
  if (!btn || !panel) return;
  const mode = S.countryMode || 'any';
  const val = (mode === 'specific' && S.specificCountry) ? 'c:' + S.specificCountry : mode;
  let label = mode === 'every' ? 'Every country' : 'Any country';
  panel.querySelectorAll('.cf-opt').forEach(o => {
    const on = o.dataset.val === val;
    o.classList.toggle('active', on);
    if (on) label = o.textContent;
  });
  document.getElementById('cfBtnLabel').textContent = label;
  btn.classList.toggle('filtering', val !== 'any');
}

function closeCountryFilterPanel() {
  document.getElementById('countryFilterPanel').classList.remove('open');
}

document.getElementById('countryFilterBtn').onclick = e => {
  e.stopPropagation();
  const panel = document.getElementById('countryFilterPanel');
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  // Scroll the current choice into view when opening the (deliberately short) list
  if (opening) { const act = panel.querySelector('.cf-opt.active'); if (act) act.scrollIntoView({block:'nearest'}); }
};

document.getElementById('countryFilterPanel').onclick = e => {
  e.stopPropagation();
  const opt = e.target.closest('.cf-opt');
  if (!opt) return;
  const v = opt.dataset.val;
  if (v.startsWith('c:')) { S.countryMode = 'specific'; S.specificCountry = v.slice(2); }
  else { S.countryMode = v; }
  closeCountryFilterPanel();
  syncCountryFilterUI();
  persistSession();
};

document.addEventListener('click', closeCountryFilterPanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCountryFilterPanel(); });

// Push the current land/sea/border colours (S.landColor/seaColor/borderColor)
// onto the live map. Shared by the individual colour pickers and Night mode.
function applyMapColors() {
  const borderStroke = S.physicalMode ? 'none' : S.borderColor;
  svg.select('#countries-g').selectAll('path').attr('fill', S.physicalMode ? 'none' : S.landColor).attr('stroke', borderStroke);
  svg.select('#borders-path').attr('stroke', borderStroke);
  svg.select('#state-borders').attr('stroke', borderStroke);
  svg.select('#nation-border').attr('stroke', borderStroke);
  svg.select('#pref-borders').attr('stroke', borderStroke);
  svg.select('#nation-border-jp').attr('stroke', borderStroke);
  svg.select('#sphere').attr('fill', S.physicalMode ? 'none' : S.seaColor);
  document.getElementById('mapWrap').style.background = S.physicalMode ? '#05070c' : S.seaColor;
}

// Re-apply fill/stroke/glow to every existing dot from the current S settings.
// Shared by the dot colour/alpha pickers and Night mode.
function applyDotStyles() {
  svg.selectAll('.city-dot circle.main-dot')
    .attr('fill', dotFill()).attr('fill-opacity', dotFillOpacity())
    .attr('stroke', dotStroke())
    .attr('stroke-width', function() { return dotStrokeWidth(+d3.select(this).attr('data-pop')); })
    .attr('filter', dotFilter());
}

document.getElementById('landColor').oninput=e=>{ S.landColor=e.target.value; applyMapColors(); persistSession(); };
document.getElementById('seaColor').oninput=e=>{ S.seaColor=e.target.value; applyMapColors(); persistSession(); };
document.getElementById('borderColor').oninput=e=>{ S.borderColor=e.target.value; applyMapColors(); persistSession(); };

document.getElementById('nightMode').onchange = e => {
  S.nightMode = e.target.checked;
  document.body.classList.toggle('night-mode', S.nightMode);
  if (S.nightMode && S.pinMode) setPinMode(false); // map must be "normal" in Pin mode — mutually exclusive

  if (S.nightMode) {
    // Remember the current palette so switching Night mode back off restores it
    S._preNight = { landColor:S.landColor, seaColor:S.seaColor, borderColor:S.borderColor, dotColor:S.dotColor, dotAlpha:S.dotAlpha };
    Object.assign(S, NIGHT_PRESET);
  } else if (S._preNight) {
    Object.assign(S, S._preNight);
    S._preNight = null;
  }

  document.getElementById('landColor').value = S.landColor;
  document.getElementById('seaColor').value = S.seaColor;
  document.getElementById('borderColor').value = S.borderColor;
  document.getElementById('dotColor').value = S.dotColor;
  document.getElementById('dotAlpha').value = Math.round(S.dotAlpha * 100);
  document.getElementById('dotAlphaVal').textContent = Math.round(S.dotAlpha * 100) + '%';

  applyMapColors();
  applyDotStyles();
  resizeNightCanvas();
  drawNightCanvas();
  persistSession();
};

document.getElementById('resetDotColorAlpha').onclick = () => {
  // If Night mode is currently on, the dot colour/alpha shown right now are the
  // NIGHT_PRESET values, not the user's normal ones — those live in S._preNight
  // and only take effect again once Night mode is switched off. Reset those
  // instead, so Night mode's look is undisturbed but reverts to defaults later.
  if (S.nightMode && S._preNight) {
    S._preNight.dotColor = DOT_DEFAULTS.dotColor;
    S._preNight.dotAlpha = DOT_DEFAULTS.dotAlpha;
  } else {
    S.dotColor = DOT_DEFAULTS.dotColor;
    S.dotAlpha = DOT_DEFAULTS.dotAlpha;
    document.getElementById('dotColor').value = S.dotColor;
    document.getElementById('dotAlpha').value = Math.round(S.dotAlpha * 100);
    document.getElementById('dotAlphaVal').textContent = Math.round(S.dotAlpha * 100) + '%';
    applyDotStyles();
  }
  persistSession();
};

document.getElementById('resetMapColors').onclick = () => {
  // Same Night-mode-aware pattern as the dot colour/alpha reset above: while
  // Night mode is on, the visible land/sea/border colours are the
  // NIGHT_PRESET values, not the user's normal palette — that lives in
  // S._preNight and only takes effect again once Night mode is switched off.
  if (S.nightMode && S._preNight) {
    S._preNight.landColor = MAP_DEFAULTS.landColor;
    S._preNight.seaColor = MAP_DEFAULTS.seaColor;
    S._preNight.borderColor = MAP_DEFAULTS.borderColor;
  } else {
    S.landColor = MAP_DEFAULTS.landColor;
    S.seaColor = MAP_DEFAULTS.seaColor;
    S.borderColor = MAP_DEFAULTS.borderColor;
    document.getElementById('landColor').value = S.landColor;
    document.getElementById('seaColor').value = S.seaColor;
    document.getElementById('borderColor').value = S.borderColor;
    applyMapColors();
  }
  persistSession();
};

document.getElementById('physicalMode').onchange = async e => {
  S.physicalMode = e.target.checked;
  if (S.physicalMode && S.pinMode) setPinMode(false); // map must be "normal" in Pin mode — mutually exclusive
  const g = svg.select('#map-g');
  const [W, H] = getMapSize();
  await updatePhysicalLayer(g, W, H);
  persistSession();
};

// Pin mode: dots render as 3D-style pins in one of 4 fixed colours instead of
// flat circles. Mutually exclusive with Night/Physical mode, since the point
// is a "normal" map — enabling it switches those off first (and reverts any
// palette Night mode had swapped in).
function setPinMode(on) {
  S.pinMode = on;
  document.getElementById('pinMode').checked = on;
  document.body.classList.toggle('pin-mode', on);
  document.getElementById('dotColorRow').style.display = on ? 'none' : '';
  if (on) {
    if (S.nightMode) { document.getElementById('nightMode').checked = false; document.getElementById('nightMode').dispatchEvent(new Event('change')); }
    if (S.physicalMode) { document.getElementById('physicalMode').checked = false; document.getElementById('physicalMode').dispatchEvent(new Event('change')); }
  }
  applyPinStyles();
  persistSession();
}
document.getElementById('pinMode').onchange = e => setPinMode(e.target.checked);

function fmtPop(n){ if(!n)return''; return Math.round(n).toLocaleString('de-DE'); }
function fmtLocation(city) {
  if (city.country === 'US' && city.admin1 && US_STATES[city.admin1]) {
    const stateName = US_STATES[city.admin1].replace(/\b\w/g, l => l.toUpperCase());
    return `${stateName}, United States`;
  }
  if (city.country && city.admin1) {
    const admin1Name = ADMIN1_NAMES[city.country + '.' + city.admin1];
    if (admin1Name) return `${admin1Name}, ${fmtCountry(city.country)}`;
  }
  return fmtCountry(city.country);
}

// ─── SESSION SYSTEM ──────────────────────────────────────────────────────────
const SESS_KEY = 'wcq_sessions';      // localStorage key for all sessions
const SESS_CUR = 'wcq_current_sess';  // localStorage key for current session id

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function loadAllSessions() {
  try { return JSON.parse(localStorage.getItem(SESS_KEY)) || {}; } catch(e) { return {}; }
}
function saveAllSessions(sessions) {
  localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
}

// Snapshot current in-memory game state into a session object
function captureState() {
  // Save current region's found list into foundByRegion before snapshotting
  const fbr = {...(captureState._fbr || {})};
  fbr[currentRegion] = found.map(c => ({...c}));
  captureState._fbr = fbr;
  return {
    foundByRegion: fbr,
    region: currentRegion,
    S: {...S},
    sortByPop,
  };
}
captureState._fbr = {};

// Restore in-memory game state from a session snapshot
async function restoreState(snap) {
  // Restore settings object
  Object.assign(S, snap.S || {});
  sortByPop = snap.sortByPop || false;
  document.getElementById('sortByPop').checked = sortByPop;

  // Sync settings UI
  document.getElementById('dotColor').value     = S.dotColor;
  document.getElementById('dotAlpha').value     = Math.round(S.dotAlpha * 100);
  document.getElementById('dotAlphaVal').textContent = Math.round(S.dotAlpha * 100) + '%';
  document.querySelectorAll('#dotSizePresets .scale-preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sizeMode === (S.dotSizeMode || 'normal'));
  });
  document.getElementById('landColor').value    = S.landColor;
  document.getElementById('seaColor').value     = S.seaColor;
  document.getElementById('borderColor').value  = S.borderColor;
  document.getElementById('nightMode').checked  = !!S.nightMode;
  document.getElementById('physicalMode').checked = !!S.physicalMode;
  document.body.classList.toggle('night-mode', !!S.nightMode);
  document.getElementById('pinMode').checked = !!S.pinMode;
  document.body.classList.toggle('pin-mode', !!S.pinMode);
  document.getElementById('dotColorRow').style.display = S.pinMode ? 'none' : '';
  applyPinStyles();

  // Sync country filter UI
  syncCountryFilterUI();

  // Restore region dropdown
  const region = snap.region || 'world';
  tintRegionSelect(region);

  // Restore per-region found cities
  captureState._fbr = {};
  const fbr = snap.foundByRegion || {};
  // Legacy: if old snapshot has flat 'found', migrate it
  if (!snap.foundByRegion && snap.found) {
    fbr[region] = snap.found;
  }
  // Copy all regions into _fbr
  for (const [r, cities] of Object.entries(fbr)) {
    captureState._fbr[r] = cities.map(c => ({...c}));
  }
  found = (captureState._fbr[region] || []).map(c => ({...c}));
  await drawMap(region);
  renderFoundGrid();
  renderBestCountries();
  renderOtherStats();
  updateSummary();
}

// Persist current session to localStorage
function persistSession() {
  const sessions = loadAllSessions();
  const id = localStorage.getItem(SESS_CUR);
  if (!id || !sessions[id]) return;
  if (sessions[id].status === 'saved') return; // frozen
  sessions[id].snapshot = captureState();
  sessions[id].updatedAt = Date.now();
  saveAllSessions(sessions);
}

// Switch to a session by id; persist current first
async function switchSession(id) {
  persistSession(); // save current before leaving
  const sessions = loadAllSessions();
  const sess = sessions[id];
  if (!sess) return;
  localStorage.setItem(SESS_CUR, id);
  await restoreState(sess.snapshot || {found:[], region:'world', S:{...S}, sortByPop:false});
  updateSessionBar();
  renderSessionList();
  // If saved session, lock the input
  lockIfSaved();
}

function lockIfSaved() {
  const sessions = loadAllSessions();
  const id = localStorage.getItem(SESS_CUR);
  const isSaved = id && sessions[id] && sessions[id].status === 'saved';
  document.getElementById('cityInput').disabled  = isSaved;
  document.getElementById('guessBtn').disabled   = isSaved;
  document.getElementById('clearBtn').disabled   = isSaved;
  if (isSaved) {
    document.getElementById('cityInput').placeholder = 'This session is saved (read-only)';
  } else {
    document.getElementById('cityInput').placeholder = 'Type a city name and press Enter…';
  }
}

function updateSessionBar() {
  const sessions = loadAllSessions();
  const id = localStorage.getItem(SESS_CUR);
  const sess = id && sessions[id];
  const nameEl  = document.getElementById('sessionName');
  const dotEl   = document.getElementById('sessDot');
  const setDot = (saved) => {
    dotEl.className = 'sess-dot ' + (saved ? 'saved' : 'active');
    const label = saved ? 'Saved' : 'Active';
    dotEl.title = label; dotEl.setAttribute('aria-label', label);
  };
  if (sess) {
    nameEl.textContent = sess.name;
    setDot(sess.status === 'saved');
  } else {
    nameEl.textContent = 'No session';
    setDot(false);
  }
}

function createSession(name) {
  const sessions = loadAllSessions();
  const id = genId();
  sessions[id] = {
    id, name: name || 'Untitled Session',
    status: 'active',
    createdAt: Date.now(), updatedAt: Date.now(),
    snapshot: captureState(),
  };
  saveAllSessions(sessions);
  return id;
}

function renderSessionList() {
  const sessions = loadAllSessions();
  const currentId = localStorage.getItem(SESS_CUR);
  const list = document.getElementById('sessList');
  const entries = Object.values(sessions).sort((a,b) => b.updatedAt - a.updatedAt);
  if (!entries.length) {
    list.innerHTML = '<div class="sess-empty">No sessions yet. Create one below!</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(sess => {
    const isCurrent = sess.id === currentId;
    const snap = sess.snapshot || {};
    const cityCount = snap.foundByRegion
      ? Object.values(snap.foundByRegion).reduce((s, arr) => s + arr.length, 0)
      : (snap.found || []).length;
    const region = snap.region || 'world';
    const regionLabel = (REGIONS[region] || {}).label || region;
    const updated = new Date(sess.updatedAt).toLocaleString();
    const card = document.createElement('div');
    card.className = 'sess-card' + (isCurrent ? ' current' : '');
    card.innerHTML = `
      <div class="sess-card-top">
        <span class="sess-card-name" title="${sess.name}">${sess.name}</span>
        <span class="sess-badge ${sess.status}">${sess.status === 'saved' ? '🔒 Saved' : '● Active'}</span>
      </div>
      <div class="sess-card-meta">${cityCount} ${cityCount===1?'city':'cities'} · ${regionLabel} · ${updated}</div>
      <div class="sess-card-actions">
        ${!isCurrent ? `<button class="sca primary" data-action="load" data-id="${sess.id}">Load</button>` : '<span style="font-size:11px;color:var(--accent2);font-weight:600">▶ Current</span>'}
        ${sess.status === 'active' ? `<button class="sca success" data-action="freeze" data-id="${sess.id}">💾 Save</button>` : ''}
        ${sess.status === 'active' ? `<button class="sca" data-action="rename" data-id="${sess.id}">Rename</button>` : ''}
        <button class="sca danger" data-action="delete" data-id="${sess.id}">Delete</button>
      </div>`;
    list.appendChild(card);
  });

  // Wire up actions
  list.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const {action, id} = btn.dataset;
      const sessions2 = loadAllSessions();
      if (action === 'load') {
        await switchSession(id);
        closeSessModal();
      } else if (action === 'freeze') {
        if (!confirm('Save this session? It will become read-only and cannot be changed.')) return;
        persistSession();
        const s2 = loadAllSessions();
        s2[id].status = 'saved'; s2[id].updatedAt = Date.now();
        saveAllSessions(s2);
        updateSessionBar(); renderSessionList(); lockIfSaved();
      } else if (action === 'rename') {
        const newName = prompt('New session name:', sessions2[id].name);
        if (!newName || !newName.trim()) return;
        sessions2[id].name = newName.trim();
        saveAllSessions(sessions2);
        updateSessionBar(); renderSessionList();
      } else if (action === 'delete') {
        if (!confirm(`Delete "${sessions2[id].name}"? This cannot be undone.`)) return;
        delete sessions2[id];
        saveAllSessions(sessions2);
        const currentId2 = localStorage.getItem(SESS_CUR);
        if (currentId2 === id) {
          // Switch to another session or create a fresh one
          const remaining = Object.values(sessions2);
          if (remaining.length) {
            await switchSession(remaining.sort((a,b)=>b.updatedAt-a.updatedAt)[0].id);
          } else {
            const newId = createSession('Session 1');
            localStorage.setItem(SESS_CUR, newId);
            found = []; svg.select('#map-g').selectAll('.city-dot').remove();
            renderFoundGrid(); updateSummary(); updateSessionBar(); lockIfSaved();
            renderBestCountries();
            renderOtherStats();
          }
          closeSessModal();
        } else {
          renderSessionList();
        }
      }
    };
  });
}

function openSessModal() {
  persistSession();
  renderSessionList();
  document.getElementById('sessModal').classList.add('open');
  document.getElementById('newSessNameInput').focus();
}
function closeSessModal() {
  document.getElementById('sessModal').classList.remove('open');
}

// ── Session bar inline rename ──
document.getElementById('sessionName').onclick = () => {
  const sessions = loadAllSessions();
  const id = localStorage.getItem(SESS_CUR);
  if (!id || !sessions[id] || sessions[id].status === 'saved') return;
  const newName = prompt('Rename session:', sessions[id].name);
  if (!newName || !newName.trim()) return;
  sessions[id].name = newName.trim();
  saveAllSessions(sessions);
  updateSessionBar();
};

document.getElementById('sessManagerBtn').onclick = openSessModal;
document.getElementById('sessClose').onclick      = closeSessModal;
document.getElementById('sessModal').onclick = e => { if (e.target === document.getElementById('sessModal')) closeSessModal(); };

document.getElementById('createSessBtn').onclick = async () => {
  const input = document.getElementById('newSessNameInput');
  const name = input.value.trim() || ('Session ' + (Object.keys(loadAllSessions()).length + 1));
  persistSession();
  const id = createSession(name);

  renderFoundGrid(); updateSummary(); updateSessionBar(); lockIfSaved();

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  // ── Session bootstrap ──
  let sessions = loadAllSessions();
  let currentId = localStorage.getItem(SESS_CUR);

  // Validate current id still exists
  if (currentId && !sessions[currentId]) currentId = null;

  // If no sessions at all, create a default one
  if (!Object.keys(sessions).length) {
    currentId = createSession('Session 1');
    localStorage.setItem(SESS_CUR, currentId);
    sessions = loadAllSessions();
  } else if (!currentId) {
    // Pick the most recently updated
    currentId = Object.values(sessions).sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
    localStorage.setItem(SESS_CUR, currentId);
  }

  // Restore the session via restoreState (handles foundByRegion, settings, map, etc.)
  const snap = sessions[currentId].snapshot || {};
  await restoreState(snap);
  updateSessionBar();
  lockIfSaved();

  autoLoadCities();
});

// ─── LOCAL CACHE (IndexedDB) ────────────────────────────────────────────────
// Downloading + gunzipping + parsing the GeoNames export is the expensive
// part of every page load. data-version.json is a tiny file (written by the
// .github/workflows/update-cities.yml Action alongside data.txt.gz) whose
// "version" field only changes when the underlying data actually changes.
// We cache the fully-parsed cityDB in IndexedDB keyed to that version, so a
// repeat visit with no new data skips the download/parse entirely.
const CITY_CACHE_DB = 'worldCityQuizCache';
const CITY_CACHE_STORE = 'kv';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CITY_CACHE_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(CITY_CACHE_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(CITY_CACHE_STORE, 'readonly');
      const req = tx.objectStore(CITY_CACHE_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return undefined; }
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(CITY_CACHE_STORE, 'readwrite');
      tx.objectStore(CITY_CACHE_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* ignore cache write failures — worst case we re-download next time */ }
}

// ─── CITY DATA WORKER ─────────────────────────────────────────────────────
// Downloading, gunzipping (pako.inflate) and parsing ~200k+ GeoNames rows
// (each one running fold() diacritic-stripping, alias splitting, etc.) is
// genuinely heavy CPU work — tens to hundreds of milliseconds on desktop,
// but multiple seconds of dead-air on a mid-range phone. Doing that on the
// main thread means the whole page — including the map itself — freezes
// solid for the duration, since JS is single-threaded there. Running it in
// a Web Worker moves all of it off the main thread, so the map stays
// interactive (and the page never looks "stuck") while the data loads in
// the background. The worker is built from an inline string via a Blob URL
// so the game still ships as a single self-contained HTML file, and it
// duplicates the small set of pure helper functions (fold, Mexican alias
// generation, disputed-capital table) it needs — these have no DOM
// dependency so they're safe to run off-thread as-is.
const CITY_WORKER_SRC = `
self.importScripts('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');

const DISPUTED_CAPITALS = { 'IL':'Jerusalem','TW':'Taipei','PS':'Ramallah','CY':'Nicosia','XK':'Pristina','BO':'La Paz' };
const EMPTY_ALIASES_F = [];

function fold(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
    .replace(/[-\\s]+/g, ' ')
    .trim()
    .replace(/\\bsaint\\b/g, 'st')
    .replace(/\\bsainte\\b/g, 'st')
    .replace(/\\.(?=\\s|$)/g, '');
}

function getMexicanAliases(name) {
  const f = fold(name);
  const extras = new Set();
  const prefixes = [
    'ciudad', 'heroica', 'heroico', 'villa de', 'villa', 'san luis',
    'santiago de', 'santiago', 'victoria de', 'victoria',
    'heroica ciudad de', 'ciudad de', 'municipio de',
    'general', 'el', 'la', 'los', 'las',
  ];
  for (const pfx of prefixes) {
    if (f.startsWith(pfx + ' ')) {
      let rest = f.slice(pfx.length).trim();
      rest = rest.replace(/^de(l)? /, '').replace(/^(la|las|los|el) /, '');
      if (rest.length > 2) extras.add(rest);
    }
  }
  const deMatch = f.match(/^(.+?) de .+$/);
  if (deMatch && deMatch[1].length > 2) extras.add(deMatch[1].trim());
  const words = f.split(' ');
  if (words.length >= 3) {
    const twoWord = words.slice(0, 2).join(' ');
    if (twoWord.length > 3) extras.add(twoWord);
  }
  extras.delete(f);
  return [...extras];
}

function parseTSV(text) {
  const lines = text.split('\\n');
  let swappedCount = 0;
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line || line.charCodeAt(0) === 35) continue;
    const r = line.split('\\t');
    if (r.length < 9) continue;
    const isSlim = r.length < 15;
    const featureCode = (isSlim ? r[6] : r[7]).trim();
    if (featureCode === 'PPLX') continue;
    const name = r[1].trim();
    if (!name) continue;
    const asciiRaw = r[2].trim();
    const ascii_name = asciiRaw || name;
    const altField = r[3];
    const aliases = altField ? altField.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean) : [];
    const country = (isSlim ? r[7] : r[8]).trim();
    const admin1 = ((isSlim ? r[8] : r[10]) || '').trim().toUpperCase();
    const pop = parseInt(isSlim ? r[9] : r[14]) || 0;
    let lat = parseFloat(r[4]);
    let lon = parseFloat(r[5]);
    if (isNaN(lat) || isNaN(lon)) continue;
    const latOk = lat >= -90 && lat <= 90;
    const lonOk = lon >= -180 && lon <= 180;
    if (!latOk && lonOk && lon >= -90 && lon <= 90 && lat >= -180 && lat <= 180) {
      [lat, lon] = [lon, lat]; swappedCount++;
    } else if (!latOk || !lonOk) continue;
    const disputedCap = DISPUTED_CAPITALS[country];
    const isCapital = (featureCode === 'PPLC' && (!disputedCap || disputedCap === ascii_name)) || disputedCap === ascii_name;
    const nameF = fold(name);
    const asciiF = asciiRaw && asciiRaw !== name ? fold(ascii_name) : nameF;
    const mxAliases = country === 'MX' && pop >= 50000 ? getMexicanAliases(name) : null;
    const aliasesF = (aliases.length || mxAliases)
      ? [...new Set([...aliases.map(fold), ...(mxAliases || [])])]
      : EMPTY_ALIASES_F;
    const geonamesId = parseInt(r[0]);
    out.push({ name, ascii_name, nameF, asciiF, aliasesF, aliases, lat, lon, country, admin1, pop, isCapital, geonamesId });
  }
  return { cityDB: out, swappedCount };
}

self.onmessage = async (e) => {
  const { cmd, id, url } = e.data;
  try {
    if (cmd === 'fetchGz') {
      const res = await fetch(url);
      if (!res.ok) { self.postMessage({ id, ok:false, notFound:true }); return; }
      const buf = await res.arrayBuffer();
      const text = pako.inflate(new Uint8Array(buf), { to: 'string' });
      const { cityDB, swappedCount } = parseTSV(text);
      self.postMessage({ id, ok:true, cityDB, swappedCount });
    } else if (cmd === 'fetchText') {
      const res = await fetch(url);
      if (!res.ok) { self.postMessage({ id, ok:false, notFound:true }); return; }
      const text = await res.text();
      const { cityDB, swappedCount } = parseTSV(text);
      self.postMessage({ id, ok:true, cityDB, swappedCount });
    } else if (cmd === 'parseText') {
      const { cityDB, swappedCount } = parseTSV(e.data.text);
      self.postMessage({ id, ok:true, cityDB, swappedCount });
    }
  } catch (err) {
    self.postMessage({ id, ok:false, error: (err && err.message) || String(err) });
  }
};
`;

let _cityWorker = null;
let _cityWorkerReqId = 0;
const _cityWorkerCallbacks = new Map();
function getCityWorker() {
  if (!_cityWorker) {
    const blob = new Blob([CITY_WORKER_SRC], { type: 'application/javascript' });
    _cityWorker = new Worker(URL.createObjectURL(blob));
    _cityWorker.onmessage = (e) => {
      const cb = _cityWorkerCallbacks.get(e.data.id);
      if (cb) { _cityWorkerCallbacks.delete(e.data.id); cb(e.data); }
    };
    _cityWorker.onerror = (e) => {
      // Reject every in-flight call so callers fall back gracefully instead
      // of hanging forever if the worker itself fails to start.
      for (const [id, cb] of _cityWorkerCallbacks) cb({ id, ok:false, error: e.message || 'worker error' });
      _cityWorkerCallbacks.clear();
    };
  }
  return _cityWorker;
}
function runInCityWorker(msg) {
  return new Promise((resolve) => {
    const worker = getCityWorker();
    const id = ++_cityWorkerReqId;
    _cityWorkerCallbacks.set(id, resolve);
    worker.postMessage({ ...msg, id });
  });
}
// Workers need a same-origin-ish fetchable script URL for importScripts and
// a structured-cloneable message; both are unsupported under file:// and on
// a few very old browsers. Detect once and fall back to the original
// main-thread path (loadCitiesFromTSV) in that case, so nothing regresses,
// it just loses the non-blocking benefit.
const CITY_WORKER_SUPPORTED = (typeof Worker !== 'undefined') && (location.protocol !== 'file:');

async function autoLoadCities() {
  setMsg('Loading city data…', 'info');
  // Cheap check first: does the published data differ from what we have cached?
  let remoteVersion = null;
  try {
    const vRes = await fetch('data-version.json', { cache: 'no-store' });
    if (vRes.ok) remoteVersion = (await vRes.json()).version || null;
  } catch (e) { /* offline, file:// protocol, or file not published yet */ }

  if (remoteVersion) {
    try {
      const cachedVersion = await idbGet('version');
      if (cachedVersion === remoteVersion) {
        const cachedCities = await idbGet('cityDB');
        if (Array.isArray(cachedCities) && cachedCities.length) {
          cityDB = cachedCities;
          finaliseCityDB(0, 'cache');
          return;
        }
      }
    } catch (e) { /* cache unreadable — fall through to a full load */ }
  }

  try {
    // Try the gzip-compressed file first (fetched as bytes, then inflated
    // client-side with pako — this is what lets a ~40MB GeoNames export ship
    // as a ~13MB .gz that's small enough to push straight to GitHub), then
    // fall back to an uncompressed txt, then xlsx. The fetch + inflate +
    // parse all happen inside a Web Worker when available (see
    // CITY_WORKER_SUPPORTED above) so this never blocks the UI thread —
    // the map stays pannable/zoomable the whole time instead of freezing.
    if (CITY_WORKER_SUPPORTED) {
      try {
        const gz = await runInCityWorker({ cmd: 'fetchGz', url: 'data.txt.gz' });
        if (gz.ok) {
          cityDB = gz.cityDB;
          finaliseCityDB(gz.swappedCount, 'txt');
          if (remoteVersion) { idbSet('version', remoteVersion); idbSet('cityDB', cityDB); }
          return;
        }
      } catch (e) { /* fall through to the uncompressed options below */ }

      for (const url of ['data.txt', 'cities15000.txt', 'cities.txt']) {
        const r = await runInCityWorker({ cmd: 'fetchText', url });
        if (!r.ok) continue; // not found (or worker hiccup) — try the next candidate
        cityDB = r.cityDB;
        finaliseCityDB(r.swappedCount, 'txt');
        if (remoteVersion) { idbSet('version', remoteVersion); idbSet('cityDB', cityDB); }
        return;
      }

      // xlsx parsing (XLSX.js) stays on the main thread — it's only ever a
      // last-resort fallback if none of the txt/gz files are published, so
      // it's not worth the extra complexity of moving into the worker too.
      const xlsxRes = await fetch('cities.xlsx');
      if (xlsxRes.ok) {
        const buf = await xlsxRes.arrayBuffer();
        loadCitiesFromBuffer(buf);
        if (remoteVersion) { idbSet('version', remoteVersion); idbSet('cityDB', cityDB); }
        return;
      }
      return;
    }

    // No worker support (e.g. file:// or a very old browser) — original
    // main-thread path, unchanged.
    try {
      const gzRes = await fetch('data.txt.gz');
      if (gzRes.ok) {
        const buf = await gzRes.arrayBuffer();
        const text = pako.inflate(new Uint8Array(buf), { to: 'string' });
        loadCitiesFromTSV(text);
        if (remoteVersion) { idbSet('version', remoteVersion); idbSet('cityDB', cityDB); }
        return;
      }
    } catch (e) { /* fall through to the uncompressed options below */ }

    for (const [url, isTxt] of [['data.txt', true], ['cities15000.txt', true], ['cities.txt', true], ['cities.xlsx', false]]) {
      const res = await fetch(url);
      if (!res.ok) continue;
      if (isTxt) {
        const text = await res.text();
        loadCitiesFromTSV(text);
      } else {
        const buf = await res.arrayBuffer();
        loadCitiesFromBuffer(buf);
      }
      if (remoteVersion) { idbSet('version', remoteVersion); idbSet('cityDB', cityDB); }
      return;
    }
  } catch (e) {
    // file:// protocol or file not found — do nothing, user can load manually
  }
}

// ─── WHAT DID I MISS ─────────────────────────────────────────────────────────
function updateMissedBtn() {
  document.getElementById('missedBtnWrap').style.display = found.length > 0 ? 'block' : 'none';
}

function buildMissedModal() {
  const isUSA   = currentRegion === 'usa';
  const isJapan = currentRegion === 'japan';
  const regionDef = REGIONS[currentRegion];
  const foundIds  = new Set(found.map(c => dotId(c)));

  // Filter DB to current region
  function inRegion(c) {
    return cityInRegion(c, regionDef);
  }
  function wasFound(c) { return foundIds.has(dotId(c)); }

  const sections = [];

  // Population thresholds — same three tiers shown in the stats panel, for
  // every map (not just World).
  for (const [thresh, label] of [[1_000_000,'1,000,000'], [500_000,'500,000'], [100_000,'100,000']]) {
    const missedAtThresh = cityDB
      .filter(c => (c.pop||0) >= thresh && inRegion(c) && !wasFound(c))
      .sort((a,b) => b.pop - a.pop);
    if (missedAtThresh.length) {
      sections.push({
        title: `Missing cities over ${label} (${missedAtThresh.length})`,
        chips: missedAtThresh.map(c => ({ label: `${displayName(c)} (${fmtPop(c.pop)})`, cls: 'big' })),
      });
    }
  }

  // Capitals — what counts as one depends on the map: state capitals for the
  // US map, prefecture capitals for the Japan map, national capitals
  // everywhere else.
  let missedCapitals = [];
  if (isUSA) {
    US_STATE_CAPITALS.forEach((abbr, cityNameLower) => {
      const gotIt = found.some(c => c.name.toLowerCase() === cityNameLower && (c.admin1||'').toUpperCase() === abbr);
      if (!gotIt) missedCapitals.push({ label: `${cityNameLower.replace(/\b\w/g, l => l.toUpperCase())} (${abbr})`, cls: 'capital' });
    });
    missedCapitals.sort((a,b) => a.label.localeCompare(b.label));
  } else if (isJapan) {
    Object.entries(JP_PREF_CAPITAL_NAMES).forEach(([jisId, cityNameLower]) => {
      const id = Number(jisId);
      const gotIt = found.some(c => c.country === 'JP' && jpCapitalKey(c) === cityNameLower);
      if (!gotIt) missedCapitals.push({ label: `${cityNameLower.replace(/\b\w/g, l => l.toUpperCase())} (${JP_PREF_NAMES[id]})`, cls: 'capital' });
    });
    missedCapitals.sort((a,b) => a.label.localeCompare(b.label));
  } else {
    const applicableUN = regionDef.countries
      ? regionDef.countries.filter(c => UN_COUNTRIES.has(c))
      : [...UN_COUNTRIES];
    missedCapitals = cityDB
      .filter(c => c.isCapital && applicableUN.includes(c.country) && inRegion(c) && !wasFound(c))
      .sort((a,b) => a.name.localeCompare(b.name))
      .map(c => ({ label: c.name, cls: 'capital' }));
  }
  if (missedCapitals.length) {
    sections.push({
      title: `Missing capitals (${missedCapitals.length})`,
      chips: missedCapitals,
    });
  }

  const body = document.getElementById('missedBody');
  body.innerHTML = '';
  if (!sections.length) {
    body.innerHTML = '<p style="color:var(--success);font-weight:600;text-align:center;padding:20px">🎉 Nothing missed in these categories!</p>';
    return;
  }
  // Each category is a native <details> disclosure, closed by default, so
  // opening the modal never spoils what's still left to find — the user
  // picks which category (if any) to reveal.
  sections.forEach(({ title, chips }) => {
    const sec = document.createElement('details');
    sec.className = 'missed-section';
    const summary = document.createElement('summary');
    summary.className = 'missed-section-title';
    summary.textContent = title;
    const grid = document.createElement('div');
    grid.className = 'missed-grid';
    chips.forEach(({ label, cls }) => {
      const chip = document.createElement('span');
      chip.className = 'missed-chip ' + cls;
      chip.textContent = label;
      grid.appendChild(chip);
    });
    sec.appendChild(summary);
    sec.appendChild(grid);
    body.appendChild(sec);
  });
}

document.getElementById('missedBtn').addEventListener('click', () => {
  buildMissedModal();
  const modal = document.getElementById('missedModal');
  modal.style.display = 'flex';
});
document.getElementById('missedClose').addEventListener('click', () => {
  document.getElementById('missedModal').style.display = 'none';
});
document.getElementById('missedModal').addEventListener('click', e => {
  if (e.target === document.getElementById('missedModal'))
    document.getElementById('missedModal').style.display = 'none';
});

// ─── MOBILE: HIDE/SHOW CITY LIST PANEL ────────────────────────────────────
// On narrow screens the found-cities panel (plus the top-countries panel)
// sits below the map. This lets the user collapse it so the map fills most
// of the screen, then bring it back.
(function () {
  const btn = document.getElementById('panelToggleBtn');
  function setCollapsed(collapsed) {
    document.body.classList.toggle('panel-collapsed', collapsed);
    btn.textContent = collapsed ? '▸ Show list' : '▾ Hide list';
  }
  btn.addEventListener('click', () => {
    setCollapsed(!document.body.classList.contains('panel-collapsed'));
  });
  setCollapsed(false);
})();

// ─── DESKTOP: COLLAPSE/EXPAND CITY LIST ──────────────────────────────────────
// The list floats over the right edge of the map (see "FLOATING, COLLAPSIBLE
// CITY LIST" in the CSS), so toggling it is just a class change — the map is
// never resized, redrawn or re-centred. The only JS needed besides the toggle
// is measuring #leftCol's scrollbar so the list can sit beside it.
(function () {
  const btn = document.getElementById('listCollapseBtn');
  const leftCol = document.getElementById('leftCol');
  const appRow = document.getElementById('appRow');

  function syncScrollbarGap() {
    const w = Math.max(0, leftCol.offsetWidth - leftCol.clientWidth);
    appRow.style.setProperty('--sbw', w + 'px');
  }
  syncScrollbarGap();
  window.addEventListener('resize', syncScrollbarGap);
  if (window.ResizeObserver) new ResizeObserver(syncScrollbarGap).observe(leftCol);

  function setListCollapsed(collapsed) {
    document.body.classList.toggle('list-collapsed', collapsed);
    btn.setAttribute('aria-expanded', String(!collapsed));
    const label = collapsed ? 'Show city list' : 'Collapse city list';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  btn.addEventListener('click', () => {
    setListCollapsed(!document.body.classList.contains('list-collapsed'));
  });

  // Called by highlightCity(): clicking a city on the map while the list is
  // collapsed slides the list back open so the city's row can be seen.
  window.expandCityList = function () {
    if (document.body.classList.contains('list-collapsed')) setListCollapsed(false);
  };
})();
</script>
